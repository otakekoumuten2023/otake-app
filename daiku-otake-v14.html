}
// 品目を変えたら、場所の在庫数の表示と単価を入れ直す（tmOnItem が作った場所の選択は使わない）
function coOnItem(i){
  var row = tmRow(i); if(!row) return;
  var o = _coState.ops[i], it = coItemOf(i);
  var old = row.querySelector('.tm-loc'); if(old) old.remove();
  ['co-from','co-to'].forEach(function(cls){
    var s = row.querySelector('.'+cls); if(!s) return;
    var cur = s.value;
    if(!cur && cls==='co-from' && it && (o.type==='use'||o.type==='out'||o.type==='ret')){ var a = tmAutoLoc(it); if(a) cur = 'loc:'+a; }
    var tmp = document.createElement('div');
    tmp.innerHTML = coLocSel(cls, cur, it, cls==='co-to' && o.type==='out', cls==='co-to'?'to':'', o._toText);
    s.replaceWith(tmp.firstChild);
  });
  var pr = row.querySelector('.co-price'); if(pr && it && !pr.value) pr.value = it.basePrice||'';
  row.querySelector('.tm-unit').textContent = (it&&it.unit) || o.unit || '';
}
function coOnLoc(sel){
  if(sel.value==='txt:'){
    var i = +sel.closest('.co-row').dataset.i, o = _coState.ops[i];

    if(name===null){ sel.value=''; return; }
    o._toText = name.trim();
    sel.options[sel.selectedIndex].textContent = '✏️ '+(o._toText||'現場')+'（場所一覧にない現場・在庫からは消える）';
  }
}
function coApply(){
  var r = _coState, date = document.getElementById('co-date').value || today();
  var jobSel = document.getElementById('co-job').value;
  var job = coJobs().find(function(j){ return j.id===jobSel; });
  var jobName = job ? job.name : (jobSel==='__none__' ? '' : r.job||'');
  var jobCode = job ? job.id : '';
  var plan = [], bad = 0;
  // 上の行から順に反映したときの在庫で足りるかを見る（持出してから使う、など）
  var sim = {};
  var simGet = function(it, loc){ var k = it.id+'|'+loc; if(!(k in sim)) sim[k] = parseFloat((it.stocks||{})[loc])||0; return sim[k]; };
  var simAdd = function(it, loc, q){ simGet(it, loc); sim[it.id+'|'+loc] += q; };
  r.ops.forEach(function(o, i){
    var row = tmRow(i), err = row.querySelector('.co-err'); err.textContent = '';
    var id = row.querySelector('.tm-item').value;
    if(id==='__skip__') return;
    var qty = parseFloat(row.querySelector('.tm-qty').value);
    var f = (row.querySelector('.co-from')||{}).value||'', t = (row.querySelector('.co-to')||{}).value||'';
    var fromId = f.indexOf('loc:')===0 ? f.slice(4) : '', toId = t.indexOf('loc:')===0 ? t.slice(4) : '';
    var toText = t==='txt:' ? (o._toText||'') : '';
    var it = coItemOf(i), price = parseFloat((row.querySelector('.co-price')||{}).value);
    var e = '';
    if(!it && id!=='__new__') e = '品目を選んでください';
    else if(!(qty>0)) e = '数量を入れてください';
    else if(o.type==='in' && !toId) e = '入れる場所を選んでください';
    else if(o.type!=='in' && !fromId) e = '場所を選んでください';
    else if((o.type==='out'||o.type==='ret') && !toId && !toText) e = '行き先を選んでください';
    else if(fromId && toId && fromId===toId) e = '元と行き先が同じです';
    else if(it && fromId && simGet(it, fromId) < qty - 1e-9) e = '在庫が足りません（'+locations.find(function(l){return l.id===fromId;}).name+'に '+simGet(it, fromId)+(it.unit||'')+'）。数量か場所を直すか「反映しない」にしてください';
    if(e){ err.textContent = '⚠️ '+e; bad++; return; }
    if(it){ if(o.type==='in') simAdd(it, toId, qty); else { simAdd(it, fromId, -qty); if(toId) simAdd(it, toId, qty); } }
    plan.push({o:o, it:it, isNew: id==='__new__', qty:qty, fromId:fromId, toId:toId, toText:toText, price: price});
  });
  if(bad){ showSyncBadge('⚠️ 直すところが'+bad+'行あります', '#e87050'); return; }
  if(!plan.length){ closeModalForce(); return; }
  var lname = function(id){ var l = locations.find(function(x){ return x.id===id; }); return l ? l.name : ''; };
  plan.forEach(function(p){
    var it = p.it, o = p.o;
    if(p.isNew){
      it = {id:'itm-'+Date.now()+'-'+Math.floor(Math.random()*100000), name:o.name, unit:o.unit||'個', category:'その他', basePrice:p.price||0, stocks:{}, minStock:0, stockId:'', memo:'チャットから登録'};
      items.push(it);
    }
    if(!it.stocks) it.stocks = {};
    var up = o.type==='in' ? (p.price>0 ? p.price : (it.basePrice||0)) : (it.basePrice||0);
    if(o.type==='in'){ it.stocks[p.toId] = (parseFloat(it.stocks[p.toId])||0) + p.qty; if(p.price>0) it.basePrice = p.price; }
    else {
      it.stocks[p.fromId] = (parseFloat(it.stocks[p.fromId])||0) - p.qty;
      if(p.toId) it.stocks[p.toId] = (parseFloat(it.stocks[p.toId])||0) + p.qty;
    }
    history.unshift({id: Date.now()+Math.random(), date: date, type: o.type, itemId: it.id, itemName: it.name, stockId: it.stockId||'',
      unit: it.unit||'', qty: p.qty,
      locName: o.type==='in' ? lname(p.toId) : lname(p.fromId),
      destName: o.type==='in' ? '' : (p.toId ? lname(p.toId) : (p.toText || (o.type==='use' ? jobName : ''))),
      destLocId: p.toId && o.type!=='in' ? p.toId : '',
      jobName: jobName, jobCode: jobCode, supplier: o.type==='in' ? (o.supplier||'') : '',
      memo: 'チャットから', unitPrice: up, chatKey: o.chatKey});
  });
  save(); closeModalForce(); render();
  showSyncBadge('✅ 在庫操作 '+plan.length+'件を反映しました', '#70c870');
}

// ============================================================
// 棚卸し（2026/11/11）
//  置き場ごとに「合っていれば✓、違えば実数」を入れ、違いだけを確認して確定する。
//  ・下書きはこの端末に残る（途中でやめても続きから）
//  ・同じ品目が「ある置き場で足りない／別の置き場で多い」ときは移動として記録できる
//  ・確定すると、違った分を履歴に「棚卸し調整」として残す（原価の実績には入らない）
//  ・紙・タブレット用のチェック表（A4）を出せる。手書きの結果はチャットで整えて貼り付けられる
// ============================================================
var ST_KEY = 'dk_stocktake';
var stLoc = null, stView = 'count', stFilter = 'all', stSearch = '';
function stLoad(){ try{ var s = JSON.parse(localStorage.getItem(ST_KEY)||'null'); return (s && s.drafts) ? s : {drafts:{}}; }catch(e){ return {drafts:{}}; } }
function stSave(s){ try{ localStorage.setItem(ST_KEY, JSON.stringify(s)); }catch(e){} }
function stDraft(locId, create){
  var s = stLoad();
  if(!s.drafts[locId] && create){ s.drafts[locId] = {date: today(), counts:{}, extras:[]}; stSave(s); }
  return s.drafts[locId] || null;
}
function stPut(locId, d){ var s = stLoad(); s.drafts[locId] = d; stSave(s); }
function stLocItems(locId){
  // その置き場で数える品目：在庫がある・並びに入れた・下書きで数えた・この1年に出入りがあった品目
  //（場所を作ると全品目に「0個」の欄ができるため、欄があるだけの品目は出さない 2026/11/11）
  var d = stDraft(locId), l = locations.find(function(x){ return x.id===locId; }) || {}, keep = {};
  (Array.isArray(l.shelf) ? l.shelf : []).forEach(function(e){ if(typeof e!=='object') keep[String(e)] = 1; });
  if(d){ Object.keys(d.counts||{}).forEach(function(k){ keep[k] = 1; }); }
  var from = (function(){ var t = new Date(); t.setFullYear(t.getFullYear()-1); return t.toISOString().slice(0,10); })();
  var hk = history.length+'|'+(history[0]?history[0].id:'')+'|'+l.name;
  if(!window._stHistCache || window._stHistCache.n!==hk){
    var m = {}; history.forEach(function(h){ if(String(h.date||'')<from) return; [h.locName, h.destName].forEach(function(nm){ if(!nm) return; (m[nm] = m[nm] || {})[String(h.itemId!=null?h.itemId:'')] = 1; (m[nm]['n:'+h.itemName] = 1); }); });
    window._stHistCache = {n: hk, m: m};
  }
  var hm = window._stHistCache.m[l.name] || {};
  return items.filter(function(i){
    var q = parseFloat((i.stocks||{})[locId])||0;
    return q!==0 || keep[String(i.id)] || hm[String(i.id)] || hm['n:'+i.name];
  });
}
function stBook(item, locId){ return parseFloat((item.stocks||{})[locId]) || 0; }
function stNum(v){ return Math.round((+v||0)*1000)/1000; }
function stActual(c, book){ if(!c) return null; if(c.qty!=null && c.qty!=='') return parseFloat(c.qty); if(c.ok) return book; return null; }
function stStats(locId){
  var d = stDraft(locId), list = stLocItems(locId), done = 0, diff = 0;
  list.forEach(function(i){ var c = d && d.counts[String(i.id)]; var a = stActual(c, stBook(i, locId)); if(a!=null){ done++; if(Math.abs(a - stBook(i, locId))>1e-9) diff++; } });
  return {total: list.length, done: done, diff: diff + ((d && d.extras.length) || 0), extras: (d && d.extras.length) || 0, has: !!d};
}
function stLocName(id){ var l = locations.find(function(x){ return x.id===id; }); return l ? l.name : ''; }

function openStocktake(locId){
  currentTab = '棚卸し'; stLoc = locId || null; stView = 'count'; stFilter = 'all'; stSearch = '';
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  render(); window.scrollTo(0,0);
}

function stDiscard(locId){

    + '<div style="height:5px;background:#2e2e28;border-radius:3px;margin-top:5px"><div id="st-bar" style="height:5px;width:'+pct+'%;background:#c8962a;border-radius:3px"></div></div></div>'
    + '<div style="display:flex;gap:5px;padding:8px 12px 0;flex-wrap:wrap">'+chip('all','すべて')+chip('todo','まだ')+chip('diff','違う')+chip('busy','よく動く')+chip('prev','前に違った')+'</div>'
    + '<input class="search-box" type="search" placeholder="🔍 一覧を絞り込む（品名・品番）" value="'+esc(stSearch)+'" oninput="stSearch=this.value;clearTimeout(window._stT);window._stT=setTimeout(render,250)"/>'
    + '<div style="color:#666;font-size:10px;padding:2px 16px 4px">並び：'+(stHasShelf(stLoc)?(l.shelfManual?'手で設定した棚の順':'前回数えた順'):'種類ごと（寸法順）')+'　<a href="#" style="color:#c8962a" onclick="stOpenOrder(\''+l.id+'\');return false">↕️ 並び・区切りを直す</a>'

function stRefreshRow(id){
  var item = items.find(function(i){ return String(i.id)===String(id); }); if(!item) return;
  var el = document.getElementById('st-r-'+id);
  if(el){
    var d = stDraft(stLoc), c = d.counts[String(id)] || {}, book = stBook(item, stLoc), st = stRowState(item, c), a = stActual(c, book), dv = a==null?null:stNum(a-book);
    el.style.borderColor = st==='ok' ? '#3a6a3a' : st==='diff' ? '#a8642a' : '#2e2e28';
    var info = document.getElementById('st-i-'+id);
    if(info){ info.style.color = st==='diff'?'#e8a050':'#666'; info.innerHTML = (st==='diff'?'違い '+(dv>0?'+':'')+dv+' '+esc(item.unit||'')+'（'+(dv>0?'+':'')+yen(dv*(item.basePrice||0))+'）':st==='ok'?'✓ 合っている':'')+(c.memo?'　📝 '+esc(c.memo):''); }
    var okb = el.querySelector('button'); if(okb){ var on = c.ok && (c.qty==null||c.qty===''); okb.style.background = on?'#2a5a2a':''; okb.style.color = on?'#a8e8a8':''; }
  }
  var st2 = stStats(stLoc), pct = st2.total ? Math.round(st2.done/st2.total*100) : 0;
  var p = document.getElementById('st-prog'); if(p) p.textContent = '数えた '+st2.done+' / '+st2.total+' 品目（'+pct+'%）・違い '+st2.diff+'件';
  var b = document.getElementById('st-bar'); if(b) b.style.width = pct+'%';
}
function stOk(id){
  var d = stDraft(stLoc, true), c = d.counts[id] = d.counts[id] || {};
  var on = c.ok && (c.qty==null||c.qty==='');
  if(on){ c.ok = false; } else { c.ok = true; c.qty = null; stTouch(id); }
  if(!c.ok && (c.qty==null||c.qty==='') && !c.memo) delete d.counts[id];
  stPut(stLoc, d);
  var el = document.getElementById('st-r-'+id); if(el){ var inp = el.querySelector('input'); if(inp && !on) inp.value = ''; }
  stRefreshRow(id);
}
function stSetQty(id, v){
  var d = stDraft(stLoc, true), c = d.counts[id] = d.counts[id] || {};
  if(v===''||v==null){ c.qty = null; } else { c.qty = parseFloat(v); c.ok = false; stTouch(id); }
  if(!c.ok && (c.qty==null) && !c.memo) delete d.counts[id];
  stPut(stLoc, d); stRefreshRow(id);
}
function stMemo(id){
  var d = stDraft(stLoc, true), c = d.counts[id] = d.counts[id] || {};
  var m = prompt('メモ（例：東-1へ移した、箱が濡れていた）', c.memo||''); if(m==null) return;
  c.memo = m.trim(); if(!c.ok && c.qty==null && !c.memo) delete d.counts[id];
  stPut(stLoc, d); stRefreshRow(id);
}
function stSetDate(v){ var d = stDraft(stLoc, true); d.date = v || today(); stPut(stLoc, d); }
function stAllOk(){
  var d = stDraft(stLoc, true), n = 0;
  stLocItems(stLoc).forEach(function(i){ var id = String(i.id), c = d.counts[id]; if(stActual(c, stBook(i, stLoc))==null){ d.counts[id] = Object.assign(c||{}, {ok:true, qty:null}); n++; } });

}
function stAddExtra(pre){

function stSaveExtra(){

function stDelExtra(i){ var d = stDraft(stLoc, true); d.extras.splice(i,1); stPut(stLoc, d); render(); }

// ---------- 違いの確認 ----------
// ほかの置き場の下書きで、同じ品目が反対向きにずれているもの（移動かもしれない）
function stMoveHint(item, dv){
  var s = stLoad(), out = [];
  Object.keys(s.drafts).forEach(function(lid){
    if(lid===stLoc) return;
    var d = s.drafts[lid], c = d.counts[String(item.id)];
    var a = stActual(c, stBook(item, lid)); if(a==null) return;
    var odv = a - stBook(item, lid);
    if(odv*dv < 0) out.push({locId: lid, dv: odv});
  });
  return out;
}
function stDiffs(){
  var d = stDraft(stLoc, true), res = [];
  stLocItems(stLoc).forEach(function(i){
    var c = d.counts[String(i.id)], book = stBook(i, stLoc), a = stActual(c, book);
    if(a==null || Math.abs(a-book)<1e-9) return;
    res.push({item: i, book: book, actual: a, dv: stNum(a-book), memo: (c&&c.memo)||'', moves: stMoveHint(i, a-book)});
  });
  return res;
}
function stRenderReview(){
  var l = locations.find(function(x){ return x.id===stLoc; }), d = stDraft(stLoc, true), st = stStats(stLoc);
  var diffs = stDiffs(), plus = 0, minus = 0;
  var h = '<div style="padding:10px 12px 0"><button class="btn-sm" style="padding:7px 10px" onclick="stView=\'count\';render()">← 数える画面に戻る</button></div>'
    + '<div style="padding:8px 16px 4px"><div style="color:#e8d5a3;font-size:16px;font-weight:700">違いの確認：'+esc(l?l.name:'')+'</div>'
    + '<div style="color:#888;font-size:11px;margin-top:3px">'+esc(d.date)+'・数えた '+st.done+'/'+st.total+' 品目。数えていない '+(st.total-st.done)+' 品目は、アプリの数のまま変えません。</div></div>';
  if(!diffs.length && !d.extras.length) h += '<div class="card" style="color:#70c870;font-size:13px">✓ 数えた品目は全部合っていました</div>';
  diffs.forEach(function(x, k){
    var amt = x.dv*(x.item.basePrice||0); if(amt>0) plus += amt; else minus += amt;
    h += '<div class="card" style="border-color:#a8642a;padding:10px 12px"><div style="display:flex;justify-content:space-between;gap:8px"><div style="color:#e8d5a3;font-size:13px;font-weight:700">'+esc(x.item.name)+'</div>'
      + '<div style="color:'+(x.dv>0?'#70c870':'#e87050')+';font-weight:700;white-space:nowrap">'+(x.dv>0?'+':'')+x.dv+esc(x.item.unit||'')+'</div></div>'
      + '<div style="color:#888;font-size:11px;margin-top:2px">アプリ '+stNum(x.book)+' → 実際 '+stNum(x.actual)+'　（'+(amt>0?'+':'')+yen(amt)+'）'+(x.memo?'　📝 '+esc(x.memo):'')+'</div>';
    x.moves.forEach(function(m, j){
      var q = Math.min(Math.abs(x.dv), Math.abs(m.dv));
      var from = x.dv<0 ? (l?l.name:'') : stLocName(m.locId), to = x.dv<0 ? stLocName(m.locId) : (l?l.name:'');
      h += '<label style="display:flex;gap:6px;align-items:center;margin-top:6px;color:#70d0c8;font-size:11px"><input type="checkbox" class="st-mv" data-k="'+k+'" data-j="'+j+'" checked/>'
        + esc(stLocName(m.locId))+'では '+(m.dv>0?'+':'')+stNum(m.dv)+'。移動として記録する（'+esc(from)+' → '+esc(to)+' '+stNum(q)+esc(x.item.unit||'')+'）</label>';
    });
    h += '</div>';
  });
  if(d.extras.length){
    h += '<div class="section-label">リストにない物</div>';
    d.extras.forEach(function(x, i){
      var cand = x.itemId ? [] : tmCandidates(x.name, 5);
      h += '<div class="card" style="padding:10px 12px"><div style="color:#e8d5a3;font-size:13px;font-weight:700">'+esc(x.name)+'　+'+stNum(x.qty)+esc(x.unit||'')+'</div>'
        + (x.memo?'<div style="color:#888;font-size:11px">📝 '+esc(x.memo)+'</div>':'')
        + (x.itemId ? '<div style="color:#70c870;font-size:11px;margin-top:3px">登録済みの品目に入れます</div>' + stExtraMoveHtml(x, i)
          : '<select class="form-input" style="margin:6px 0 0" onchange="stLinkExtra('+i+',this.value)"><option value="">新しい品目として登録する</option>'+cand.map(function(it){ return '<option value="'+esc(String(it.id))+'">登録済みの「'+esc(it.name)+'」に入れる</option>'; }).join('')+'</select>')
        + '</div>';
    });
  }
  h += '<div class="card" style="padding:10px 12px;font-size:12px"><div style="display:flex;justify-content:space-between"><span style="color:#888">増えた分</span><span style="color:#70c870">+'+yen(plus)+'</span></div>'
    + '<div style="display:flex;justify-content:space-between"><span style="color:#888">減った分</span><span style="color:#e87050">'+yen(minus)+'</span></div>'
    + '<div style="display:flex;justify-content:space-between;border-top:1px solid #2e2e28;margin-top:4px;padding-top:4px"><span>在庫金額の差（基準単価）</span><b>'+(plus+minus>0?'+':'')+yen(plus+minus)+'</b></div>'
    + '<div style="color:#666;font-size:10px;margin-top:4px">新しい品目は単価0で登録します。あとで品目の編集で単価を入れてください。</div></div>';
  h += '<div style="padding:8px 12px"><button class="btn-full" onclick="stConfirm()">この内容で確定する</button></div><div style="height:30px"></div>';
  return h;
}
// リストにない物が、ほかの置き場の品目なら「移動」として記録できるようにする
function stExtraMoveHtml(x, i){
  var it = items.find(function(t){ return String(t.id)===String(x.itemId); }); if(!it) return '';
  var s = stLoad();
  return locations.filter(function(l){ return l.id!==stLoc && stBook(it, l.id)>0; }).map(function(l){
    var od = s.drafts[l.id], oc = od && od.counts[String(it.id)], oa = stActual(oc, stBook(it, l.id));
    var short = oa!=null && oa < stBook(it, l.id);
    var q = Math.min(x.qty, short ? stBook(it, l.id)-oa : stBook(it, l.id));
    return '<label style="display:flex;gap:6px;align-items:center;margin-top:6px;color:#70d0c8;font-size:11px"><input type="checkbox" class="st-xmv" data-i="'+i+'" data-loc="'+l.id+'" data-q="'+q+'" '+(short?'checked':'')+'/>'
      + esc(l.name)+'に '+stNum(stBook(it, l.id))+esc(it.unit||'')+(short?'（数えたら '+stNum(oa)+'）':'')+'。移動として記録する（'+esc(l.name)+' → ここ '+stNum(q)+esc(it.unit||'')+'）</label>';
  }).join('');
}
function stLinkExtra(i, v){ var d = stDraft(stLoc, true); if(d.extras[i]){ d.extras[i].linkTo = v||''; stPut(stLoc, d); } }
function stHist(o){
  history.unshift(Object.assign({id: String(Date.now())+String(Math.floor(Math.random()*1e6)), date: o.date, stockId: '', destName: '', jobName: '', supplier: '', stocktake: true}, o));
}
function stConfirm(){
  var l = locations.find(function(x){ return x.id===stLoc; }); if(!l) return;
  var d = stDraft(stLoc, true), date = d.date || today();
  var diffs = stDiffs();
  var checked = {}; document.querySelectorAll('.st-mv').forEach(function(cb){ if(cb.checked) checked[cb.dataset.k+'|'+cb.dataset.j] = 1; });
  var nAdj = 0, nMove = 0, nNew = 0;
  // ① 移動（足りない置き場 → 多い置き場）
  diffs.forEach(function(x, k){
    x.moves.forEach(function(m, j){
      if(!checked[k+'|'+j]) return;
      var it = x.item, q = Math.min(Math.abs(x.dv), Math.abs(m.dv)); if(!(q>0)) return;
      var from = x.dv<0 ? stLoc : m.locId, to = x.dv<0 ? m.locId : stLoc;
      it.stocks[from] = stNum(stBook(it, from) - q); it.stocks[to] = stNum(stBook(it, to) + q);
      stHist({date: date, type: 'move', itemId: it.id, itemName: it.name, stockId: it.stockId||'', unit: it.unit||'', qty: q, locName: stLocName(from), destName: stLocName(to), destLocId: to, memo: '棚卸しで見つかった移動', unitPrice: it.basePrice||0});
      nMove++;
    });
  });
  // ② 残りの違いを実際の数に合わせる
  diffs.forEach(function(x){
    var it = x.item, book = stBook(it, stLoc), dv = stNum(x.actual - book);
    if(Math.abs(dv)<1e-9) return;
    it.stocks[stLoc] = stNum(x.actual);
    stHist({date: date, type: 'count', itemId: it.id, itemName: it.name, stockId: it.stockId||'', unit: it.unit||'', qty: Math.abs(dv), countDiff: dv, locName: l.name, memo: '棚卸し'+(x.memo?'：'+x.memo:''), unitPrice: it.basePrice||0});
    nAdj++;
  });
  // ③ リストにない物（ほかの置き場からの移動を先に記録）
  document.querySelectorAll('.st-xmv').forEach(function(cb){
    if(!cb.checked) return;
    var x = d.extras[+cb.dataset.i], it = x && items.find(function(t){ return String(t.id)===String(x.itemId); }); if(!it) return;
    var from = cb.dataset.loc, q = Math.min(parseFloat(cb.dataset.q)||0, stBook(it, from)); if(!(q>0)) return;
    it.stocks[from] = stNum(stBook(it, from) - q); it.stocks[stLoc] = stNum(stBook(it, stLoc) + q);
    stHist({date: date, type: 'move', itemId: it.id, itemName: it.name, stockId: it.stockId||'', unit: it.unit||'', qty: q, locName: stLocName(from), destName: l.name, destLocId: stLoc, memo: '棚卸しで見つかった移動', unitPrice: it.basePrice||0});
    nMove++;
  });
  d.extras.forEach(function(x){
    var it = items.find(function(i){ return String(i.id)===String(x.itemId || x.linkTo || ''); });
    if(!it){
      it = {id: 'itm-'+Date.now()+'-'+Math.floor(Math.random()*100000), name: x.name, unit: x.unit||'個', category: x.category||'その他', basePrice: 0, stocks: {}, minStock: 0, stockId: '', memo: '棚卸しで登録'};
      items.push(it); nNew++;
    }
    if(!it.stocks) it.stocks = {};
    var book = stBook(it, stLoc), dv = stNum(x.qty - book);
    it.stocks[stLoc] = stNum(x.qty);
    if(Math.abs(dv)>1e-9){ stHist({date: date, type: 'count', itemId: it.id, itemName: it.name, stockId: it.stockId||'', unit: it.unit||'', qty: Math.abs(dv), countDiff: dv, locName: l.name, memo: '棚卸しで見つけた'+(x.memo?'：'+x.memo:''), unitPrice: it.basePrice||0}); nAdj++; }
  });
  var st = stStats(stLoc);
  l.lastCount = date; l.lastCountDone = st.done; l.lastCountTotal = st.total;
  var learned = stLearnOrder(l, d);
  var s = stLoad(); delete s.drafts[stLoc]; stSave(s);
  save();
  var name = l.name; stLoc = null; stView = 'count'; render();
  alert(name+' の棚卸しを確定しました。\n・数を直した品目：'+nAdj+'件\n・移動として記録：'+nMove+'件'+(nNew?'\n・新しく登録した品目：'+nNew+'件（単価0）':'')+(learned?'\n・数えた順を、次回の並びとして覚えました':'')+'\n\n履歴に「棚卸し調整」として残っています。長押しで取り消せます。');
}

// ---------- チャットの棚卸し結果を貼り付け ----------
//  【棚卸し】2026-11-15 北-1
//  杉KD 105角 12本        … 実際の数
//  ✓ 構造用合板 12mm      … 合っている
//  ＋ 防水テープ 3巻 ※東-1から  … リストにない物（※の後はメモ）
//  残りは全部✓            … まだの品目を全部合っているにする
function stOpenPaste(){
  showModal('<div class="sheet" onclick="event.stopPropagation()"><div class="sheet-title">📋 チャットの棚卸し結果を貼り付け</div>'
    + '<div style="color:#888;font-size:11px;margin-bottom:8px;line-height:1.6">チェック表の写真をチャットに送ると、この形で返ってきます。貼り付けると数える画面に入るので、確かめてから確定してください。</div>'
    + '<textarea class="form-input" id="st-paste" style="min-height:180px;font-size:12px" placeholder="【棚卸し】2026-11-15 北-1\n杉KD 105角 12本\n✓ 構造用合板 12mm\n＋ 防水テープ 3巻 ※東-1から\n残りは全部✓"></textarea>'
    + '<div class="btn-row"><button class="btn-cancel" onclick="closeModalForce()">やめる</button><button class="btn-confirm green" onclick="stApplyPaste(document.getElementById(\'st-paste\').value)">読み込む</button></div></div>');
}
function stFindLoc(name){
  var k = tmNorm(name); if(!k) return null;
  return locations.find(function(l){ return tmNorm(l.name)===k; }) || locations.find(function(l){ var n = tmNorm(l.name); return n && (k.indexOf(n)>=0 || n.indexOf(k)>=0); }) || null;
}
function stFindItem(name, locId){
  var ex = tmExact(name);
  var inLoc = ex.filter(function(i){ return i.stocks && Object.prototype.hasOwnProperty.call(i.stocks, locId); });
  return inLoc[0] || (ex.length===1 ? ex[0] : null);
}
function stParseDate(s){
  var t = String(s||''); try{ t = t.normalize('NFKC'); }catch(e){}
  var m = t.match(/(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/); if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m = t.match(/(\d{1,2})[\/月](\d{1,2})/); if(m) return new Date().getFullYear()+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);
  return '';
}
function stApplyPaste(raw){
  var text = String(raw||'').replace(/\r/g,'').replace(/```[a-z]*/g,'');
  var s = stLoad(), cur = null, rep = {}, firstLoc = null, notes = [];
  text.split('\n').forEach(function(line0){
    var line = line0.trim(); if(!line) return;
    var n = line; try{ n = line.normalize('NFKC'); }catch(e){}
    var hm = n.match(/^【棚卸し?】\s*(.*)$/);
    if(hm){
      var rest = hm[1], date = stParseDate(rest);
      var locTxt = rest.replace(/\d{4}[-\/年.]\d{1,2}[-\/月.]\d{1,2}日?/,'').replace(/\d{1,2}[\/月]\d{1,2}日?/,'').replace(/[（(][^)）]*[)）]/g,'').trim();
      var l = stFindLoc(locTxt);
      if(!l){ notes.push('置き場「'+locTxt+'」が見つかりません'); cur = null; return; }
      if(!s.drafts[l.id]) s.drafts[l.id] = {date: today(), counts:{}, extras:[]};
      cur = {loc: l, d: s.drafts[l.id]}; if(date) cur.d.date = date;
      rep[l.id] = rep[l.id] || {name: l.name, qty:0, ok:0, extra:0, unknown:[], all:0};
      if(!firstLoc) firstLoc = l.id;
      return;
    }
    if(!cur){ return; }
    var R = rep[cur.loc.id];
    if(/^(残り|のこり|ほか|他).*(全部|すべて|全て).*(✓|✔|OK|ok|合)/.test(n)){
      stLocItems(cur.loc.id).forEach(function(i){ var id = String(i.id), c = cur.d.counts[id]; if(stActual(c, stBook(i, cur.loc.id))==null){ cur.d.counts[id] = Object.assign(c||{}, {ok:true, qty:null}); R.all++; } });
      return;
    }
    var memo = ''; var mi = n.search(/[※＊]/); if(mi>=0){ memo = n.slice(mi+1).trim(); n = n.slice(0, mi).trim(); }
    var ok = /^[✓✔☑]|^(OK|ok)\s/.test(n); if(ok) n = n.replace(/^([✓✔☑]|OK|ok)\s*/,'').trim();
    var extra = /^[＋+]/.test(n); if(extra) n = n.replace(/^[＋+]\s*/,'').trim();
    n = n.replace(/^[・\-\*•●]\s*/,'').trim(); if(!n) return;
    var p = tmParse(n)[0] || {name:n, qty:null, unit:''};
    var it = stFindItem(ok ? n : p.name, cur.loc.id) || (ok ? null : stFindItem(n, cur.loc.id));
    var inLoc = it && it.stocks && Object.prototype.hasOwnProperty.call(it.stocks, cur.loc.id);
    var ordPush = function(x){ cur.d.order = cur.d.order || []; if(cur.d.order.indexOf(x)<0) cur.d.order.push(x); };
    if(ok && it){ var id = String(it.id); cur.d.counts[id] = Object.assign(cur.d.counts[id]||{}, {ok:true, qty:null}); if(memo) cur.d.counts[id].memo = memo; ordPush(id); R.ok++; return; }
    if(!extra && it && inLoc && p.qty!=null){ var id2 = String(it.id); cur.d.counts[id2] = Object.assign(cur.d.counts[id2]||{}, {ok:false, qty:p.qty}); if(memo) cur.d.counts[id2].memo = memo; ordPush(id2); R.qty++; return; }
    if(p.qty!=null){ cur.d.extras.push({name: it ? it.name : p.name, qty: p.qty, unit: p.unit || (it&&it.unit) || '', memo: memo, itemId: it ? String(it.id) : ''}); R.extra++; if(!it) R.unknown.push(p.name); return; }
    R.unknown.push(n);
  });
  if(!firstLoc){ alert('「【棚卸し】日付 置き場名」の行が見つかりませんでした。'+(notes.length?'\n'+notes.join('\n'):'')); return; }
  stSave(s); closeModalForce();
  var msg = Object.keys(rep).map(function(k){ var R = rep[k]; return '■ '+R.name+'：数 '+R.qty+'件・✓ '+R.ok+'件'+(R.all?'・残り全部✓ '+R.all+'件':'')+'・リストにない物 '+R.extra+'件'+(R.unknown.length?'\n　読めなかった・品目が見つからない：'+R.unknown.slice(0,8).join('、')+(R.unknown.length>8?' ほか':''):''); }).join('\n');
  alert('棚卸しの下書きに入れました。\n'+msg+(notes.length?'\n'+notes.join('\n'):'')+'\n\n数える画面で確かめてから「違いを確認する」→「確定」してください。');
  openStocktake(firstLoc);
}


// ============================================================
// 棚卸し その2（2026/11/11）
//  ・すばやく入れる欄：品名と数（音声入力でも）→ 置き場の中の候補 → 押すと数が入る／その行へ飛ぶ
//  ・棚の並び：数えた順を覚えて次回その順に並べる。「A段」などの区切りを入れて並べ替えられる（置き場に保存・同期される）
//  ・チェック表：棚の順（区切りの見出しつき）か、種類ごと＋寸法順
//  ・動き：置き場・品目ごとの出入り、よく動く／動かない品目、棚卸しの差
// ============================================================
var stOrderSel = null, stTrendDays = 90, stTrendLoc = '', stQuickTimer = null;
// 寸法の数字が並び順で効くように（105 と 45 なら 45 が先）
function stSortKey(s){ return tmNorm(s).replace(/\d+(\.\d+)?/g, function(n){ return ('000000000'+n.split('.')[0]).slice(-9); }); }
function stCatSort(list){
  return list.slice().sort(function(a,b){
    var ca = a.category||'その他', cb = b.category||'その他';
    if(ca!==cb) return ca.localeCompare(cb, 'ja');
    var ka = stSortKey(a.name), kb = stSortKey(b.name); return ka<kb?-1:ka>kb?1:0;
  });
}
// 置き場の並び：[{sec:'A段'} か item] の配列。shelf がなければ種類ごとに見出しを付ける
function stOrdered(locId, mode){
  var l = locations.find(function(x){ return x.id===locId; }) || {};
  var list = stLocItems(locId), byId = {}; list.forEach(function(i){ byId[String(i.id)] = i; });
  var out = [], used = {};
  if(mode!=='cat' && Array.isArray(l.shelf) && l.shelf.length){
    l.shelf.forEach(function(e){
      if(e && typeof e==='object' && e.sec!=null){ out.push({sec: e.sec}); return; }
      var it = byId[String(e)]; if(it && !used[String(e)]){ out.push(it); used[String(e)] = 1; }
    });
    var rest = stCatSort(list.filter(function(i){ return !used[String(i.id)]; }));
    if(rest.length){ out.push({sec:'並びが決まっていない品目', auto:true}); out = out.concat(rest); }
  } else {
    var cat = null;
    stCatSort(list).forEach(function(i){ var c = i.category||'その他'; if(c!==cat){ cat = c; out.push({sec:c, auto:true}); } out.push(i); });
  }
  // 中身のない見出しは消す（並べ替えの画面では残す）
  if(mode==='edit') return out;
  return out.filter(function(e, k){ if(e.sec==null) return true; for(var j=k+1;j<out.length;j++){ if(out[j].sec!=null) return false; return true; } return false; });
}
function stHasShelf(locId){ var l = locations.find(function(x){ return x.id===locId; }); return !!(l && Array.isArray(l.shelf) && l.shelf.length); }
// 数えた順を下書きに残す
function stTouch(id){ var d = stDraft(stLoc, true); d.order = d.order || []; if(d.order.indexOf(String(id))<0){ d.order.push(String(id)); stPut(stLoc, d); } }
// 確定のとき：並びを手で直していない置き場は、数えた順を次回の並びにする
function stLearnOrder(l, d){
  if(!d || !d.order || d.order.length<2 || l.shelfManual) return false;
  var cur = stOrdered(l.id).filter(function(e){ return e.sec==null; }).map(function(i){ return String(i.id); });
  var seen = {}, order = [];
  d.order.forEach(function(id){ if(!seen[id] && cur.indexOf(id)>=0){ seen[id] = 1; order.push(id); } });
  cur.forEach(function(id){ if(!seen[id]){ seen[id] = 1; order.push(id); } });
  l.shelf = order; return true;
}

//  ・言葉を足すほど絞り込む（すべての言葉を含む品目だけ。数字と文字の境目でも分ける：「杉105」→「杉」「105」）
//  ・この置き場で見つからなければ、ほかの置き場の同じ品目と近い品目を出す
//  ・それでもなければ「新しく加える」。品名は今の品目の書き方にそろえる

function stQuickClear(focus){

// 話した言葉・打った言葉を、品名の書き方に寄せる（かける→×、ミリ→mm、全角→半角）
function stVoiceNorm(t){
  t = String(t||''); try{ t = t.normalize('NFKC'); }catch(e){}
  return t.replace(/\s*(かける|掛ける|掛け|かけ)\s*/g,'×').replace(/(\d)\s*[xX*＊✕]\s*(?=\d)/g,'$1×').replace(/ミリ/g,'mm').replace(/センチ/g,'cm').replace(/[　]+/g,' ').trim();
}
function stWords(t){
  var out = [];
  stVoiceNorm(t).split(/\s+/).forEach(function(w){
    var k = tmNorm(w); if(!k) return;
    (k.match(/\d+(?:\.\d+)?(?:x\d+(?:\.\d+)?)+/g) || []).forEach(function(dm){ out.push(dm); });   // 寸法はつながりのまま（105x105）
    (k.match(/[0-9.]+|[^0-9.x]+|x/g) || []).forEach(function(p){ if(p && p!=='x') out.push(p); });
  });
  return out.filter(function(w, i){ return out.indexOf(w)===i; });
}
function stHay(i){ return tmNorm(i.name + ' ' + (i.stockId||'') + ' ' + (i.category||'')); }
// 文字は「含む」、数字は品名の数字と一致するときだけ（「3」で 3000 に当たらないように）
function stMatchAll(i, words){
  var h = stHay(i), nums = h.match(/\d+(?:\.\d+)?/g) || [];
  return words.every(function(w){ return (/^\d/.test(w) && w.indexOf('x')<0) ? nums.indexOf(w)>=0 : h.indexOf(w)>=0; });
}
function stRank(list, words, raw){
  var k = tmNorm(stVoiceNorm(raw));
  return list.map(function(i){
    var nums = tmNorm(i.name).match(/\d+(?:\.\d+)?/g) || [], sc = tmBigram(k, tmNorm(i.name));
    words.forEach(function(t){ if(/^\d/.test(t)){ if(nums.indexOf(t)>=0) sc += 0.3; if(nums[0]===t) sc += 0.4; } });
    if(tmNorm(i.name).indexOf(k)===0) sc += 0.5;
    return {i:i, sc:sc};
  }).sort(function(a,b){ return b.sc-a.sc; }).map(function(x){ return x.i; });
}
function stQuickFind(text){
  var words = stWords(text); if(!words.length) return {words:words, here:[], other:[], near:[]};
  var locIt = stLocItems(stLoc), ids = {}; locIt.forEach(function(i){ ids[String(i.id)] = 1; });
  var here = stRank(locIt.filter(function(i){ return stMatchAll(i, words); }), words, text);
  var other = here.length ? [] : stRank(items.filter(function(i){ return !ids[String(i.id)] && stMatchAll(i, words); }), words, text);
  var near = (here.length || other.length) ? [] : tmCandidates(stVoiceNorm(text), 5);
  return {words:words, here:here, other:other, near:near};
}
// 数の読み取り：別の欄に数があればそれ。なければ単位つきの数（12本）。単位なしの最後の数は、それを外すと見つかるときだけ数とみなす
function stQuickParse(v){
  var raw = stVoiceNorm(v), nEl = document.getElementById('st-qn'), nv = nEl && nEl.value!=='' ? parseFloat(nEl.value) : null;
  if(!raw) return null;
  if(nv!=null && !isNaN(nv)) return {name: raw, qty: nv, unit: ''};
  var mu = raw.match(new RegExp('^(.*?\\S)\\s*(\\d+(?:\\.\\d+)?)\\s*('+TM_UNITS+')$'));
  if(mu && !/[×x]$/.test(mu[1])) return {name: mu[1].trim(), qty: parseFloat(mu[2]), unit: mu[3]};
  var mb = raw.match(/^(.*\S)\s+(\d+(?:\.\d+)?)$/);
  if(mb && !stQuickFind(raw).here.length && stQuickFind(mb[1]).here.length) return {name: mb[1].trim(), qty: parseFloat(mb[2]), unit: ''};
  return {name: raw, qty: null, unit: ''};
}
function stQuickCands(name){ return stQuickFind(name).here; }

  var id = esc(String(i.id)), u = esc(i.unit||'');
  if(kind==='here'){

      + '</div>';
  }

  }

function stQuickEnter(){
  var p = stQuickParse(document.getElementById('st-q').value); if(!p) return;

// ほかの置き場の品目を、この置き場で見つけた物として加える
function stQuickAddExisting(id){
  var it = items.find(function(i){ return String(i.id)===String(id); }); if(!it) return;
  var p = stQuickParse(document.getElementById('st-q').value) || {};
  stAddExtra({name: it.name, unit: it.unit||'', qty: p.qty, itemId: String(it.id), category: it.category||''});
}
function stQuickAddNew(){
  var p = stQuickParse(document.getElementById('st-q').value) || {name:''};
  var name = stStdName(p.name), near = tmCandidates(name, 1)[0];
  stAddExtra({name: name, qty: p.qty, unit: p.unit || (near&&near.unit) || '', category: (near&&near.category) || '', std: p.name!==name ? p.name : ''});
}
// 品名を、今の品目の書き方にそろえる
//  ・全角→半角、寸法は × でつなぐ（105x105、105＊105、105かける105 → 105×105）、× のまわりの空白をとる
//  ・品名と寸法のあいだは半角スペース1つ（杉KD105×105 → 杉KD 105×105）
//  ・英字の略号は、今の品目に同じ略号があればその書き方（kd → KD）
//  ・言葉が今の品目名の一部とほぼ同じなら、その書き方に合わせる（すぎ→杉 は今の品目に「すぎ」がなければしない）
function stStdName(raw){
  var t = stVoiceNorm(raw);
  t = t.replace(/(\d)\s*×\s*(\d)/g,'$1×$2').replace(/\s+/g,' ').trim();
  t = t.replace(/([^\s\d×.])(\d+(?:\.\d+)?(?:×\d+(?:\.\d+)?)+)/g, '$1 $2');
  t = t.replace(/([^\s\d×.(（])(\d+(?:\.\d+)?)(mm|cm|m)\b/g, '$1 $2$3');
  // 英字の略号：今の品目名に出てくる書き方へ
  var abbr = {}; items.forEach(function(i){ (String(i.name).match(/[A-Za-z]{2,}/g)||[]).forEach(function(a){ var k = a.toLowerCase(); abbr[k] = abbr[k] || a; }); });
  t = t.replace(/[A-Za-z]{2,}/g, function(a){ return abbr[a.toLowerCase()] || a; });
  // 先頭の言葉（寸法の前）を、今の品目名の書き方に寄せる
  var head = t.split(' ')[0];
  if(head && !/^\d/.test(head)){
    var hk = tmNorm(head), best = null;
    items.forEach(function(i){ String(i.name).split(/\s+/).forEach(function(w){ if(!best && tmNorm(w)===hk && w!==head) best = w; }); });
    if(best) t = best + t.slice(head.length);
  }
  return t;
}
function stQuickDone(item, txt){
  var q = document.getElementById('st-q'); stQuickClear(false);
  var m = document.getElementById('st-qmsg'); if(m){ m.textContent = '✓ '+item.name+' '+txt; clearTimeout(window._stQm); window._stQm = setTimeout(function(){ m.textContent = ''; }, 4000); }
  var row = document.getElementById('st-r-'+item.id);
  if(row){ var inp = row.querySelector('input'); if(inp){ var c = stDraft(stLoc).counts[String(item.id)]||{}; inp.value = (c.qty!=null&&c.qty!=='')?c.qty:''; } }
  stRefreshRow(String(item.id));
  if(q) q.focus();
}
function stQuickSet(id, qty){
  var it = items.find(function(i){ return String(i.id)===String(id); }); if(!it) return;
  var d = stDraft(stLoc, true), c = d.counts[String(id)] = d.counts[String(id)] || {};
  c.qty = qty; c.ok = false; stPut(stLoc, d); stTouch(id);
  stQuickDone(it, '→ '+stNum(qty)+(it.unit||''));
}
function stQuickOk(id){
  var it = items.find(function(i){ return String(i.id)===String(id); }); if(!it) return;
  var d = stDraft(stLoc, true), c = d.counts[String(id)] = d.counts[String(id)] || {};
  c.ok = true; c.qty = null; stPut(stLoc, d); stTouch(id);
  stQuickDone(it, '✓ 合ってる');
}
function stJump(id){
  var row = document.getElementById('st-r-'+id);
  if(!row){ stFilter = 'all'; stSearch = ''; render(); row = document.getElementById('st-r-'+id); }
  if(!row) return;
  var qh = (document.getElementById('st-quick')||{}).offsetHeight || 0;
  window.scrollTo({top: row.getBoundingClientRect().top + window.scrollY - qh - 10, behavior: 'smooth'});
  row.style.boxShadow = '0 0 0 2px #c8962a'; setTimeout(function(){ row.style.boxShadow = ''; }, 2500);
  var inp = row.querySelector('input'); if(inp) setTimeout(function(){ inp.focus({preventScroll:true}); }, 350);
  var q = document.getElementById('st-q'); if(q) q.value = ''; var box = document.getElementById('st-qc'); if(box) box.innerHTML = '';
}

// ---------- 動き（置き場・品目の変動） ----------
function stDaysAgo(n){ var d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function stItemOf(h){ return items.find(function(i){ return (h.itemId!=null && String(i.id)===String(h.itemId)) || i.name===h.itemName; }); }
// 1件の記録が、その置き場に「入った」「出た」か
function stFlow(h, locName){
  var q = parseFloat(h.qty)||0, inn = 0, out = 0;
  if(h.type==='in'){ if(!locName || h.locName===locName) inn = q; }
  else if(h.type==='use'){ if(!locName || h.locName===locName) out = q; }
  else if(h.type==='adj'){ if(!locName || h.locName===locName) inn = q; }
  else if(h.type==='out' || h.type==='ret' || h.type==='move'){
    if(!locName){ if(h.type==='out' && !h.destLocId) out = q; }
    else { if(h.locName===locName) out = q; if(h.destName===locName) inn = q; }
  }
  return {inn: inn, out: out};
}
function stItemStats(days, locName){
  var from = stDaysAgo(days), map = {};
  history.forEach(function(h){
    var d = String(h.date||'').slice(0,10); if(d<from) return;
    if(locName && h.locName!==locName && h.destName!==locName) return;
    var it = stItemOf(h); var key = it ? String(it.id) : 'n:'+h.itemName;
    var m = map[key] = map[key] || {item: it, name: it?it.name:h.itemName, moves:0, inn:0, out:0, inAmt:0, outAmt:0, cnt:0, cntAmt:0, last:''};
    var price = parseFloat(h.unitPrice) || (it&&it.basePrice) || 0;
    if(h.type==='count'){ if(!locName || h.locName===locName){ m.cnt++; m.cntAmt += (parseFloat(h.countDiff)||0)*price; } return; }
    var f = stFlow(h, locName); if(!f.inn && !f.out) return;
    m.moves++; m.inn += f.inn; m.out += f.out; m.inAmt += f.inn*price; m.outAmt += f.out*price; if(d>m.last) m.last = d;
  });
  return map;
}
function stMoveClass(n){ return n>=3 ? {l:'よく動く', c:'#e8a050'} : n>=1 ? {l:'ときどき', c:'#70a8e8'} : {l:'動かない', c:'#666'}; }

  };
  h += '<div class="section-label">'+(loc?esc(loc.name)+'で':'')+'よく動いた品目（'+active.length+'）</div>' + (active.slice(0,30).map(rowH).join('') || '<div class="empty-msg2">この期間に動いた品目はありません</div>');

// 品目1つの動き：月ごと（12か月）と置き場ごとの今の数、最近の記録
function stItemTrend(id){

  });

// ============================================================
// 現場の連携（2026/11/11）
//  ・現場の大もとは日報アプリの工事台帳（nip_jobs）
//  ・台帳の「施工中・予定」の現場は、在庫アプリの置き場（🏗️ 現場）として自動で出る
//  ・在庫アプリで作った現場の置き場は、台帳にも工事として登録する（次の工事コードつき）
//  ・台帳で名前を変えたら置き場の名前も変える（履歴に書いた置き場名も合わせる）
//  ・台帳で完工にした現場：材料が残っていれば片付けを促す。残っていなければ「終わった現場」にしまう（履歴は残る）
// ============================================================
function jsJobs(){ try{ return JSON.parse(localStorage.getItem('nip_jobs')||'[]') || []; }catch(e){ return []; } }
function jsNorm(s){ return tmNorm(s).replace(/様邸|様宅|様|邸|宅|新築|リフォーム|改修|工事|現場/g,''); }
function jsNextCode(js){
  var y = new Date().getFullYear();
  var nums = js.map(function(j){ var m = String(j.code||'').match(new RegExp('^'+y+'-(\\d+)$')); return m ? parseInt(m[1],10) : 0; });
  var n = Math.max.apply(null, [0].concat(nums)) + 1;
  return y+'-'+('00'+n).slice(-3);
}
function jsFindJob(js, name){
  var k = tmNorm(name), nk = jsNorm(name); if(!k) return null;
  var names = function(j){ return [j.name].concat(j.oldNames||[]); };
  var ex = js.find(function(j){ return names(j).some(function(x){ return tmNorm(x)===k; }); }); if(ex) return ex;
  if(!nk) return null;
  var part = js.filter(function(j){ return names(j).some(function(x){ var n = jsNorm(x); return n && (n===nk || n.indexOf(nk)>=0 || nk.indexOf(n)>=0); }); });
  return part.length===1 ? part[0] : null;
}
function locStock(lid){ return items.reduce(function(s,i){ return s + Math.max(0, parseFloat((i.stocks||{})[lid])||0); }, 0); }
function locJob(l){ return l && l.jobId ? jsJobs().find(function(j){ return j.id===l.jobId; }) || null : null; }
// 置き場の名前を変えたとき、履歴に書いた置き場名も合わせる（履歴は名前で置き場を探すため）
function jsRenameLocHist(oldN, newN){
  if(!oldN || oldN===newN) return;
  history.forEach(function(h){ if(h.locName===oldN) h.locName = newN; if(h.destName===oldN) h.destName = newN; });
}
function siteSync(){
  var js = jsJobs(), jobsChanged = false, changed = false, now = new Date().toISOString();
  // ① 在庫アプリの現場 → 台帳
  locations.filter(function(l){ return l.locType==='site'; }).forEach(function(l){
    var j = l.jobId ? js.find(function(x){ return x.id===l.jobId; }) : null;
    if(!j && !l.jobId){
      j = jsFindJob(js, l.name);
      if(!j){
        j = {id:'job-'+Date.now()+'-'+Math.floor(Math.random()*1000), code: jsNextCode(js), name: l.name, client:'', address: l.address||'', status:'active',
             memo:'在庫アプリの現場から登録', createdAt: now, updatedAt: now};
        js.unshift(j); jobsChanged = true;
      }
      l.jobId = j.id; changed = true;
    }
    if(!j) return;   // 台帳から消された工事：置き場はそのまま残す
    if(j.name && l.name!==j.name){ jsRenameLocHist(l.name, j.name); l.name = j.name; changed = true; }
    var done = j.status==='done';
    if(done && !l.jobDone){ l.jobDone = true; l.doneAt = String(j.kikanEnd||now).slice(0,10); changed = true; }
    if(!done && (l.jobDone || (l.archived && !l.userHidden))){ l.jobDone = false; if(!l.userHidden) l.archived = false; delete l.keepAfterDone; changed = true; }
    if(done && !l.archived && locStock(l.id)<=0){ l.archived = true; changed = true; }
  });
  // ② 台帳の「施工中・予定」の現場 → 在庫アプリの置き場
  js.forEach(function(j){
    if(!j || !j.id || !j.name || j.status==='done') return;
    if(locations.some(function(l){ return l.jobId===j.id; })) return;
    locations.push({id:'loc-'+j.id, name:j.name, icon:'🏗️', color:'#70c870', address:j.address||'', locType:'site', prefix:'', memo:'', jobId:j.id, fromJob:true});
    changed = true;
  });
  if(jobsChanged) localStorage.setItem('nip_jobs', JSON.stringify(js));
  if(changed) save();
  return changed;
}
// 完工したのに材料が残っている現場
function doneSitesWithStock(){ return locations.filter(function(l){ return l.locType==='site' && l.jobDone && !l.archived && !l.keepAfterDone && locStock(l.id)>0; }); }

      + '<div style="color:#c8c8b0;font-size:11px;margin:4px 0 8px">この現場に材料が '+its.length+'品目（'+yen(v)+'）残っています。倉庫へ戻すか、使い切ったかを入れてください。</div>'

  }).join('');
}
function keepDoneSite(lid){
  var l = locations.find(function(x){ return x.id===lid; }); if(!l) return;
  if(!confirm(l.name+' の材料を、現場に置いたままにしますか？（お知らせを出さなくなります。「場所」タブの現場から、あとで片付けられます）')) return;

function openSiteCleanup(lid){
  var l = locations.find(function(x){ return x.id===lid; }); if(!l) return;
  var its = items.filter(function(i){ return (parseFloat((i.stocks||{})[lid])||0)>0; });
  var whs = locations.filter(function(x){ return (x.locType||'warehouse')==='warehouse' && !x.archived; });
  var whOpts = whs.map(function(w){ return '<option value="'+w.id+'">'+esc(w.name)+'</option>'; }).join('');
  var rows = its.map(function(i){
    var q = stNum(parseFloat(i.stocks[lid])||0), id = esc(String(i.id));
    return '<div class="card" style="margin:6px 0;padding:9px 10px"><div style="display:flex;justify-content:space-between;gap:8px"><b style="color:#e8d5a3;font-size:12px;word-break:break-all">'+esc(i.name)+'</b><span style="color:#c8c8b0;font-size:12px;white-space:nowrap">'+q+esc(i.unit||'')+'</span></div>'
      + '<div style="display:flex;gap:5px;margin-top:6px;align-items:center"><select class="form-input sc-act" data-id="'+id+'" style="margin:0;flex:1;font-size:12px" onchange="this.parentNode.querySelector(\'.sc-wh\').style.display=this.value===\'ret\'?\'\':\'none\'">'
      + '<option value="ret">倉庫へ戻す</option><option value="use">使い切った（現場の原価へ）</option><option value="keep">そのまま</option></select>'
      + '<select class="form-input sc-wh" style="margin:0;flex:1;font-size:12px">'+whOpts+'</select>'
      + '<input class="form-input sc-q" type="number" inputmode="decimal" step="any" value="'+q+'" style="margin:0;width:60px;font-size:12px;text-align:center"/></div></div>';
  }).join('');
  var job = locJob(l);
  showModal('<div class="sheet" onclick="event.stopPropagation()"><div class="sheet-title">🧹 '+esc(l.name)+' の片付け</div>'
    + '<div style="color:#888;font-size:11px;line-height:1.6;margin-bottom:8px">「倉庫へ戻す」は在庫に戻ります（返却）。「使い切った」は'+(job?'「'+esc(job.name)+'」の':'この現場の')+'原価として原価アプリの実績に入ります（使用）。数は一部だけでも入れられます。</div>'
    + '<div style="display:flex;gap:6px;margin-bottom:6px"><button class="btn-sm" style="flex:1;padding:8px" onclick="document.querySelectorAll(\'.sc-act\').forEach(function(s){s.value=\'ret\';s.onchange();})">全部 倉庫へ</button><button class="btn-sm" style="flex:1;padding:8px" onclick="document.querySelectorAll(\'.sc-act\').forEach(function(s){s.value=\'use\';s.onchange();})">全部 使い切った</button></div>'
    + (whs.length>1?'<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:11px;color:#888">戻す倉庫をまとめて：<select class="form-input" style="margin:0;flex:1;font-size:12px" onchange="var v=this.value;document.querySelectorAll(\'.sc-wh\').forEach(function(s){s.value=v;})">'+whOpts+'</select></div>':'')
    + rows
    + '<label class="form-label">日付</label><input class="form-input" type="date" id="sc-date" value="'+esc(today())+'"/>'
    + '<div class="btn-row"><button class="btn-cancel" onclick="closeModalForce()">やめる</button><button class="btn-confirm green" onclick="doSiteCleanup(\''+lid+'\')">この内容で片付ける</button></div></div>');
}
function doSiteCleanup(lid){
  var l = locations.find(function(x){ return x.id===lid; }); if(!l) return;
  var job = locJob(l), date = (document.getElementById('sc-date')||{}).value || today(), nr = 0, nu = 0;
  document.querySelectorAll('.sc-act').forEach(function(sel){
    var box = sel.parentNode, act = sel.value, q = parseFloat(box.querySelector('.sc-q').value)||0;
    var it = items.find(function(i){ return String(i.id)===sel.dataset.id; }); if(!it || act==='keep' || !(q>0)) return;
    var cur = parseFloat(it.stocks[lid])||0; q = Math.min(q, cur);
    var base = {id: String(Date.now())+String(Math.floor(Math.random()*1e6)), date: date, itemId: it.id, itemName: it.name, stockId: it.stockId||'', unit: it.unit||'', qty: q, unitPrice: it.basePrice||0, supplier:''};
    if(act==='ret'){
      var wid = box.querySelector('.sc-wh').value, w = locations.find(function(x){ return x.id===wid; }); if(!w) return;
      it.stocks[lid] = stNum(cur - q); it.stocks[wid] = stNum((parseFloat(it.stocks[wid])||0) + q);
      history.unshift(Object.assign(base, {type:'ret', locName: l.name, destName: w.name, destLocId: wid, jobName: job?job.name:l.name, jobCode: job?job.id:'', memo:'完工の片付け（倉庫へ戻す）'}));
      nr++;
    } else if(act==='use'){
      it.stocks[lid] = stNum(cur - q);
      history.unshift(Object.assign(base, {type:'use', locName: l.name, destName: job?job.name:l.name, jobName: job?job.name:l.name, jobCode: job?job.id:'', memo:'完工の片付け（使い切り）'}));
      nu++;
    }
  });
  if(locStock(lid)<=0 && l.jobDone) l.archived = true;
  save(); closeModalForce(); render();
  alert(l.name+' を片付けました。\n・倉庫へ戻した：'+nr+'品目\n・使い切った（原価へ）：'+nu+'品目'+(l.archived?'\n\n在庫がなくなったので「終わった現場」にしまいました。履歴は残っています。':''));
}
// 終わった現場（しまった置き場）
function archivedSitesHtml(){
  var ar = locations.filter(function(l){ return l.archived; }); if(!ar.length) return '';
  var open = !!window._showArchived;
  var h = '<div class="section-label" style="cursor:pointer" onclick="window._showArchived=!window._showArchived;render()">'+(open?'▾':'▸')+' 📦 終わった現場（'+ar.length+'）</div>';
  if(open) h += ar.map(function(l){ return '<div class="card" style="padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;opacity:.8"><div onclick="showLocDetail(\''+l.id+'\')" style="cursor:pointer"><div style="color:#c8c8b0;font-size:13px">'+esc(l.icon||'')+' '+esc(l.name)+'</div><div style="color:#666;font-size:10px">完工 '+esc(l.doneAt||'')+'・履歴 '+history.filter(function(h){ return h.locName===l.name||h.destName===l.name; }).length+'件</div></div><button class="btn-sm" onclick="showLocDetail(\''+l.id+'\')">見る</button></div>'; }).join('');
  return h;
}

// 置き場の名前を在庫アプリで変えたとき：台帳の工事名・日報の工事名も合わせる
function jsRenameJob(jobId, newName){
  var js = jsJobs(), j = js.find(function(x){ return x.id===jobId; }); if(!j || j.name===newName) return;
  var now = new Date().toISOString();
  j.oldNames = (j.oldNames||[]).concat([j.name]).filter(function(x, i, a){ return x && x!==newName && a.indexOf(x)===i; });
  j.name = newName; j.updatedAt = now;
  localStorage.setItem('nip_jobs', JSON.stringify(js));
  try{
    var ns = JSON.parse(localStorage.getItem('nip_nippos')||'[]'), ch = false;
    ns.forEach(function(n){ if(n.jobCode===jobId && n.jobName!==newName){ n.jobName = newName; n.updatedAt = now; ch = true; } });
    if(ch) localStorage.setItem('nip_nippos', JSON.stringify(ns));
  }catch(e){}
}
function siteSyncRender(){ try{ if(siteSync()) render(); }catch(e){ console.error(e); } }
(window.OtakeSync ? OtakeSync.ready : Promise.resolve()).then(function(){ siteSyncRender(); });
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') siteSyncRender(); });
window.addEventListener('storage', function(e){ if(e.key==='nip_jobs') siteSyncRender(); });
try{ render(); }catch(e){}   // 先に描いた画面に、完工のお知らせ・終わった現場を出す

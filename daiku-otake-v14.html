function renderRenkeiTab(){
  var html = '<div style="padding:12px">';
  
  // チャットJSONインポート
  html += '<div style="background:#2a1a10;border:1px solid #4a3a20;border-radius:12px;padding:14px;margin-bottom:12px">';
  html += '<div style="color:#c8962a;font-size:13px;font-weight:700;margin-bottom:8px">&#128203; チャットからJSONで在庫操作</div>';
  html += '<div style="color:#888;font-size:10px;margin-bottom:10px;line-height:1.6">Claudeのチャットで操作指示→JSONを受け取り貼り付け→在庫に反映します。</div>';
  html += '<textarea id="zaiko-json-input" style="width:100%;min-height:120px;background:#1a1a16;border:1px solid #3a3218;border-radius:8px;padding:10px;color:#e8d5a3;font-size:11px;font-family:monospace;outline:none;resize:vertical" placeholder=\'{"action":"in","items":[{"name":"品名","qty":1,"unit":"個","locName":"倉庫名"}]}\'></textarea>';
  html += '<button onclick="importZaikoJSON()" style="margin-top:8px;width:100%;background:#3a3218;color:#c8962a;border:1px solid #4a4228;border-radius:8px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">&#10003; インポート</button>';
  html += '<div id="zaiko-json-msg" style="font-size:11px;margin-top:6px;color:#555"></div>';
  html += '</div>';

  // 日報同期
  html += '<div style="background:#1a2a1a;border:1px solid #2a4a2a;border-radius:12px;padding:14px;margin-bottom:12px">';
  html += '<div style="color:#70c870;font-size:13px;font-weight:700;margin-bottom:8px">&#128203; 日報から在庫を同期</div>';
  html += '<div style="color:#888;font-size:10px;margin-bottom:10px;line-height:1.6">日報アプリに記録された材料使用を在庫に一括反映します。</div>';
  html += '<button onclick="syncFromNippo()" style="width:100%;background:#1e3a1e;color:#70c870;border:1px solid #2e4a2e;border-radius:8px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">&#128229; 日報から在庫を同期</button>';
  html += '<div id="nippo-sync-msg" style="font-size:11px;margin-top:8px;color:#555"></div>';
  html += '</div>';

  html += '</div>';
  return html;
}

function importZaikoJSON(){
  var msg = document.getElementById('zaiko-json-msg');
  var raw = document.getElementById('zaiko-json-input') ? document.getElementById('zaiko-json-input').value.trim() : '';
  try{
    var d = JSON.parse(raw);
    var action = d.action || 'in';
    var invItems = JSON.parse(localStorage.getItem('dk_items')||'[]');
    var invHist  = JSON.parse(localStorage.getItem('dk_hist')||'[]');
    var invLocs  = JSON.parse(localStorage.getItem('dk_loc')||'[]');
    var today    = new Date().toISOString().slice(0,10);
    var count = 0;
    (d.items||[]).forEach(function(p){
      var locId = '';
      for(var i=0;i<invLocs.length;i++){ if(invLocs[i].name===p.locName){ locId=invLocs[i].id; break; } }
      if(!locId && invLocs.length) locId = invLocs[0].id;
      var item = null;
      for(var i=0;i<invItems.length;i++){ if(invItems[i].name===p.name){ item=invItems[i]; break; } }
      if(!item && (action==='in'||action==='update')){
        item = {id:'itm-'+Date.now()+'-'+Math.floor(Math.random()*100000),name:p.name,unit:p.unit||'個',category:p.category||'その他',basePrice:p.unitPrice||0,stocks:{},minStock:0,stockId:'',memo:''};
        item.stocks[locId] = 0;
        invItems.push(item);
      }
      if(!item) return;
      if(!item.stocks) item.stocks = {};
      var cur = parseFloat(item.stocks[locId]||0);
      var qty = parseFloat(p.qty)||0;
      if(action==='in') item.stocks[locId] = cur + qty;
      else if(action==='out'||action==='use') item.stocks[locId] = Math.max(0, cur - qty);
      else if(action==='update') item.stocks[locId] = qty;
      var locName = '';
      for(var i=0;i<invLocs.length;i++){ if(invLocs[i].id===locId){ locName=invLocs[i].name; break; } }
      invHist.unshift({id:Date.now()+Math.random(),date:p.date||today,type:action==='update'?'in':action,itemId:item.id,itemName:item.name,stockId:item.stockId||'',qty:qty,locName:locName||p.locName||'',jobName:p.jobName||'',memo:'チャットJSONインポート',unitPrice:p.unitPrice||0});
      count++;
    });
    localStorage.setItem('dk_items', JSON.stringify(invItems));
    localStorage.setItem('dk_hist',  JSON.stringify(invHist));
    items = invItems; history = invHist;
    render();
    if(msg){
      msg.style.color='#70c870';
      var locName = invLocs.length ? invLocs[0].name : '未設定';
      // インポートした品目の場所名を収集
      var locSet = {};
      (d.items||[]).forEach(function(p){ if(p.locName) locSet[p.locName]=1; });
      var locNames = Object.keys(locSet).join('・') || locName;
      msg.textContent = '✅ '+count+'品目を在庫資産サマリーに格納しました（場所: '+locNames+'）';
    }
    document.getElementById('zaiko-json-input').value = '';
  }catch(e){
    if(msg){ msg.style.color='#e87050'; msg.textContent='⚠️ JSONの形式が正しくありません'; }
  }
}

function syncFromNippo(){
  var msg = document.getElementById('nippo-sync-msg');
  try{
    var nippos = JSON.parse(localStorage.getItem('nip_nippos')||'[]');
    if(!nippos.length){ if(msg){ msg.style.color='#e87050'; msg.textContent='⚠️ 日報データがありません'; } return; }
    var invItems = JSON.parse(localStorage.getItem('dk_items')||'[]');
    var invHist  = JSON.parse(localStorage.getItem('dk_hist')||'[]');
    var invLocs  = JSON.parse(localStorage.getItem('dk_loc')||'[]');
    var synced = {};
    invHist.filter(function(h){ return h.nippoId; }).forEach(function(h){ synced[h.nippoId]=true; });
    var applied = 0;
    nippos.forEach(function(n){
      if(!n.materials || synced[n.id]) return;
      var jobName = n.jobName||n.jobCode||'';
      n.materials.filter(function(m){ return m.invItemId&&m.qty>0&&m.invAction!=='memo'; }).forEach(function(m){
        var item = null;
        for(var i=0;i<invItems.length;i++){ if(invItems[i].id==m.invItemId||invItems[i].name===m.name){ item=invItems[i]; break; } }
        if(!item) return;
        var locId = m.invLocId || Object.keys(item.stocks||{})[0] || '';
        var cur = parseFloat((item.stocks||{})[locId]||0);
        if(m.invAction==='use'||m.invAction==='out') item.stocks[locId] = Math.max(0, cur-(parseFloat(m.qty)||0));
        var locName = '';
        for(var i=0;i<invLocs.length;i++){ if(invLocs[i].id===locId){ locName=invLocs[i].name; break; } }
        invHist.unshift({id:Date.now()+Math.random(),date:n.date,type:m.invAction==='out'?'out':'use',itemId:item.id,itemName:item.name,stockId:item.stockId||'',qty:parseFloat(m.qty)||0,locName:locName,jobName:jobName,memo:'日報同期',nippoId:n.id});
        applied++;
      });
    });
    localStorage.setItem('dk_items', JSON.stringify(invItems));
    localStorage.setItem('dk_hist',  JSON.stringify(invHist));
    items = invItems; history = invHist; render();
    if(msg){ msg.style.color='#70c870'; msg.textContent='✅ '+applied+'件の在庫操作を反映しました'; }
  }catch(e){
    if(msg){ msg.style.color='#e87050'; msg.textContent='⚠️ 同期失敗: '+e.message; }
  }
}

</script>

.year-select{background:#161614;border:1px solid #2e2e28;border-radius:7px;padding:6px 10px;color:#e8d5a3;font-size:12px;outline:none;font-family:inherit;margin-bottom:8px;width:100%}
/* 取込み進捗 */
.import-log{background:#161614;border-radius:8px;padding:10px;font-size:10px;color:#888;max-height:120px;overflow-y:auto;margin-top:8px;font-family:monospace}
.import-log .ok{color:#70c870}
.import-log .err{color:#e87050}
.import-log .info{color:#70a8e8}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><div class="h-title">🔨 大竹工務店 在庫管理</div><div class="h-sub" id="today-date"></div></div>
      <div id="alert-badge" style="display:none;background:#3d1a10;border-radius:9px;padding:4px 9px;border:1px solid #c84a2a44;text-align:right">
        <div id="alert-num" style="color:#e87050;font-size:10px;font-weight:700"></div>
        <div style="color:#9a5040;font-size:8px">在庫不足</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="stat-num" id="s-loc">0</div><div class="stat-label">場所</div></div>
      <div class="stat"><div class="stat-num" id="s-items">0</div><div class="stat-label">品目</div></div>
      <div class="stat"><div class="stat-num blue" id="s-today">0</div><div class="stat-label">本日操作</div></div>
      <div class="stat"><div class="stat-num" id="s-low">0</div><div class="stat-label">要補充</div></div>
    </div>
  </div>
  <div id="content"></div>
  <button id="fab" onclick="onFab()">＋</button>
  <div id="tabbar">
    <button class="tab-btn active" onclick="switchTab('ホーム')" id="tab-ホーム"><span class="tab-icon">🏠</span>ホーム</button>
    <button class="tab-btn" onclick="switchTab('在庫')" id="tab-在庫"><span class="tab-icon">🪵</span>在庫</button>
    <button class="tab-btn" onclick="switchTab('場所')" id="tab-場所"><span class="tab-icon">📍</span>場所</button>
    <button class="tab-btn" onclick="switchTab('履歴')" id="tab-履歴"><span class="tab-icon">📋</span>履歴</button>
    <button class="tab-btn" onclick="switchTab('連携')" id="tab-連携"><span class="tab-icon">🔗</span>連携</button>
    <button class="tab-btn" onclick="switchTab('データ')" id="tab-データ"><span class="tab-icon">⚙️</span>データ</button>
  </div>
</div>
<div id="modal-container"></div>
<input type="file" id="file-input" accept=".xlsx,.xls,.json" style="display:none" onchange="handleFileInput(this)"/>

<script>
// ========== データ ==========
const GAS_URL = 'https://script.google.com/macros/s/AKfycby-rf-GVCyiv-NyqC_iQ7MOAL9Z6tmW93G-KoZ8yB-rGUe3SnRZZXPoII-B0t_8HacR/exec';

let locations = JSON.parse(localStorage.getItem('dk_loc')||'null') || [];
let items     = JSON.parse(localStorage.getItem('dk_items')||'null') || [];
let history   = JSON.parse(localStorage.getItem('dk_hist')||'null') || [];
let currentTab='ホーム', histFilter='all', histPeriod='all', searchVal='', moneyPeriod='month';

function save(){
  localStorage.setItem('dk_loc',JSON.stringify(locations));
  localStorage.setItem('dk_items',JSON.stringify(items));
  localStorage.setItem('dk_hist',JSON.stringify(history));
  scheduleGasSync();
}

// ===== デバウンスGAS自動同期 =====
let _gasSyncTimer=null;
function scheduleGasSync(){
  if(_gasSyncTimer) clearTimeout(_gasSyncTimer);
  _gasSyncTimer=setTimeout(()=>{
    _gasSyncTimer=null;
    pushToGAS();
  },5000); // 5秒後に変更がなければ送信
}
function pushToGAS(){
  const data={type:'backup',locations,items,history:history.slice(0,500)};
  fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
    .then(()=>{ showSyncBadge('☁️ 同期完了','#70c870'); })
    .catch(()=>{ showSyncBadge('⚠️ オフライン（ローカル保存済）','#e8b050'); });
}
function showSyncBadge(msg,color){
  let badge=document.getElementById('_sync_badge');
  if(!badge){
    badge=document.createElement('div');
    badge.id='_sync_badge';
    badge.style.cssText='position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#1a1a16;border:1px solid #2e2e28;border-radius:20px;padding:5px 14px;font-size:11px;font-family:inherit;z-index:9999;pointer-events:none;transition:opacity .4s';
    document.body.appendChild(badge);
  }
  badge.style.color=color;
  badge.textContent=msg;
  badge.style.opacity='1';
  setTimeout(()=>{ badge.style.opacity='0'; },2500);
}
function moveLocUp(locId){
  var idx=locations.findIndex(l=>l.id===locId);
  if(idx<=0)return;
  var tmp=locations[idx-1];locations[idx-1]=locations[idx];locations[idx]=tmp;
  save();render();
}

// ===== 起動時スプレッドシートから読み込み =====
// localStorageにデータがある場合はGASから読まない（編集内容を守るため）
async function loadFromSheet(){
  const hasLocal = localStorage.getItem('dk_items');
  if(hasLocal){
    console.log('ローカルデータあり → GAS読み込みスキップ');
    return;
  }
  // localStorageが空のときだけGASから初期読み込み
  try{
    showSyncBadge('☁️ 初回データ読み込み中…','#70a8e8');
    const res = await fetch(GAS_URL+'?type=zaiko',{mode:'cors'});
    const data = await res.json();
    if(data.status==='ok'){
      if(data.locations&&data.locations.length>0){
        locations=data.locations;
        localStorage.setItem('dk_loc',JSON.stringify(locations));
      }
      if(data.items&&data.items.length>0){
        items=data.items;
        localStorage.setItem('dk_items',JSON.stringify(items));
      }
      if(data.history&&data.history.length>0){
        history=data.history;
        localStorage.setItem('dk_hist',JSON.stringify(history));
      }
      render();
      showSyncBadge('☁️ GASから読み込み完了','#70c870');
      console.log('在庫データをスプレッドシートから読み込みました');
    }
  }catch(e){
    console.log('スプレッドシート読み込みエラー（オフライン時は正常）:',e);
  }
}

// GASから強制再読み込み（手動ボタン用）
async function forceLoadFromSheet(){
  if(!confirm('GASのデータでローカルを上書きします。\n現在のローカル編集内容は失われます。よろしいですか？')) return;
  localStorage.removeItem('dk_items');
  localStorage.removeItem('dk_loc');
  localStorage.removeItem('dk_hist');
  await loadFromSheet();
}

function moveLocDown(locId){
  var idx=locations.findIndex(l=>l.id===locId);
  if(idx<0||idx>=locations.length-1)return;
  var tmp=locations[idx+1];locations[idx+1]=locations[idx];locations[idx]=tmp;
  save();render();
}

// ========== ユーティリティ ==========
function totalStock(item){return Object.values(item.stocks||{}).reduce((a,b)=>a+b,0)}
function isLow(item){return item.minStock>0 && totalStock(item)<=item.minStock}
function locItemCount(lid){return items.filter(i=>(i.stocks[lid]||0)>0).length}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function yen(v){return '¥'+Math.round(v||0).toLocaleString()}
function stockValue(item){return totalStock(item)*(item.basePrice||0)}
function locStockValue(lid){return items.reduce((s,i)=>s+(i.stocks[lid]||0)*(i.basePrice||0),0)}
function totalStockValue(){return items.reduce((s,i)=>s+stockValue(i),0)}
const TYPE_META={
  in:{label:'入庫',icon:'📥',cls:'hist-in',qcls:'qty-in',tcls:'type-in',sign:'+'},
  out:{label:'出庫',icon:'📤',cls:'hist-out',qcls:'qty-out',tcls:'type-out',sign:'-'},
  use:{label:'使用',icon:'🪚',cls:'hist-use',qcls:'qty-use',tcls:'type-use',sign:'-'},
  ret:{label:'返却',icon:'↩️',cls:'hist-ret',qcls:'qty-ret',tcls:'type-ret',sign:'+'},
};
function periodFilter(h){
  const d=new Date(h.date),now=new Date();
  if(moneyPeriod==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w}
  if(moneyPeriod==='month'){return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}
  if(moneyPeriod==='year'){return d.getFullYear()===now.getFullYear()}
  return true;
}

// ========== ヘッダー ==========
function updateHeader(){
  document.getElementById('today-date').textContent=new Date().toLocaleDateString('ja-JP')+' · 場所別管理';
  const low=items.filter(isLow);
  document.getElementById('s-loc').textContent=locations.length;
  document.getElementById('s-items').textContent=items.length;
  document.getElementById('s-today').textContent=history.filter(h=>h.date===today()).length;
  const sl=document.getElementById('s-low');sl.textContent=low.length;sl.className='stat-num '+(low.length>0?'red':'green');
  const badge=document.getElementById('alert-badge');
  if(low.length>0){badge.style.display='';document.getElementById('alert-num').textContent='⚠️ '+low.length+'品目';}
  else badge.style.display='none';
}

// ========== タブ ==========
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  render();
}

function render(){
  updateHeader();
  const c=document.getElementById('content');
  if(currentTab==='ホーム') c.innerHTML=renderHome();
  else if(currentTab==='在庫') c.innerHTML=renderStock();
  else if(currentTab==='金額') c.innerHTML=renderMoney();
  else if(currentTab==='場所') c.innerHTML=renderLoc();
  else if(currentTab==='履歴') c.innerHTML=renderHist();
  else if(currentTab==='データ'){ c.innerHTML=renderData(); renderPendingList(); }
  else if(currentTab==='連携'){ c.innerHTML=renderRenkeiTab(); }
}

// ========== ホーム ==========
function renderHome(){
  const tv=totalStockValue();
  const low=items.filter(isLow);
  const todayHist=history.filter(h=>h.date===today()).slice(0,8);
  const inAmt=history.filter(h=>h.type==='in'&&periodFilter(h)).reduce((s,h)=>s+h.qty*(h.unitPrice||0),0);
  const outAmt=history.filter(h=>['out','use'].includes(h.type)&&periodFilter(h)).reduce((s,h)=>s+h.qty*(h.unitPrice||0),0);
  if(items.length===0) return `
    <div style="padding:40px 20px;text-align:center">
      <div style="font-size:48px;margin-bottom:16px">📦</div>
      <div style="color:#e8d5a3;font-size:16px;font-weight:700;margin-bottom:8px">在庫データがありません</div>
      <div style="color:#666;font-size:12px;margin-bottom:24px">「データ」タブからExcelファイルを取り込むか<br>手動で品目を追加してください</div>
      <button class="btn-full" style="max-width:200px;margin:0 auto" onclick="switchTab('データ')">⚙️ データ管理へ</button>
    </div>`;
  const lowHtml=low.length===0?'<div class="empty-msg">✓ 全品目の在庫は充分です</div>':low.map(item=>`<div class="card warn"><div class="card-row"><span class="item-name">${esc(item.name)}</span><span class="badge red">残${totalStock(item)}</span></div><div class="price-row"><div><div style="color:#666;font-size:9px">在庫金額(税抜)</div><div class="price-val">${yen(stockValue(item))}</div></div><button class="btn-sm" onclick="openIn(&quot;${item.id}&quot;)">📥 入庫</button></div></div>`).join('');
  return `
    <div class="money-banner">
      <div class="money-banner-title">📊 総在庫金額（税抜）</div>
      <div class="money-main">${yen(tv)}</div>
      <div class="money-sub">${yen(tv*1.1)}（税込10%）</div>
      <div class="money-grid">
        <div class="money-cell"><div class="money-cell-label">今月の仕入れ</div><div class="money-cell-val mc-in">${yen(inAmt)}</div></div>
        <div class="money-cell"><div class="money-cell-label">今月の出庫・使用</div><div class="money-cell-val mc-out">${yen(outAmt)}</div></div>
      </div>
    </div>
    <div class="quick-wrap">
      <div class="quick-title">クイック操作</div>
      <div class="quick-grid">
        <button class="quick-btn q-in" onclick="openIn()"><span class="q-icon">📥</span><span class="q-label">入庫</span><span class="q-desc">仕入れ・購入</span></button>
        <button class="quick-btn q-out" onclick="openOut()"><span class="q-icon">📤</span><span class="q-label">出庫</span><span class="q-desc">現場への搬出</span></button>
        <button class="quick-btn q-use" onclick="openUse()"><span class="q-icon">🪚</span><span class="q-label">使用記録</span><span class="q-desc">作業での消費</span></button>
        <button class="quick-btn q-ret" onclick="openRet()"><span class="q-icon">↩️</span><span class="q-label">返却</span><span class="q-desc">現場→倉庫へ戻す</span></button>
      </div>
    </div>
    <div class="section-label">在庫不足アラート</div>${lowHtml}
    <div class="section-label">本日の操作</div>
    ${todayHist.length===0?'<div class="empty-msg2">本日の操作なし</div>':todayHist.map(h=>histCardHtml(h)).join('')}`;
}

// ========== 在庫 ==========
function renderStock(){
  const filtered=items.filter(i=>!searchVal||i.name.includes(searchVal)||(i.stockId||'').includes(searchVal)||i.category.includes(searchVal));
  const cards=filtered.map(item=>{
    const warn=isLow(item);
    const nonZeroLocs=locations.filter(l=>(item.stocks[l.id]||0)>0);
    const maxQ=Math.max(...locations.map(l=>item.stocks[l.id]||0),1);
    const bars=nonZeroLocs.map(loc=>{
      const qty=item.stocks[loc.id]||0;
      const pct=Math.round((qty/maxQ)*100);
      return `<div><div class="bar-row"><span class="bar-loc">${loc.icon} ${esc(loc.name)}</span><span class="bar-qty" style="color:${loc.color}">${qty}${esc(item.unit)} / ${yen(qty*(item.basePrice||0))}</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${loc.color}"></div></div></div>`;
    }).join('');
    const lastIn=history.filter(h=>h.type==='in'&&h.itemId===item.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    return `<div class="card${warn?' warn':''}">
      <div class="card-row"><span class="item-name">${esc(item.stockId||'')} ${esc(item.name)}</span>${warn?'<span class="badge red">要補充</span>':''}</div>
      <div style="color:#555;font-size:10px;margin-top:2px">${esc(item.category)} · 合計 ${totalStock(item)}${esc(item.unit)}</div>
      ${bars?`<div class="stock-bars">${bars}</div>`:''}
      <div class="price-row">
        <div><div style="color:#666;font-size:9px">在庫金額（税抜）</div><div class="price-val">${yen(stockValue(item))}</div><div class="price-tax">${yen(stockValue(item)*1.1)}（税込）</div></div>
        <div style="text-align:right"><div style="color:#666;font-size:9px">基準単価</div><div style="color:#c8c8b0;font-size:12px;font-weight:600">${yen(item.basePrice||0)}/${esc(item.unit)}</div>${lastIn?`<div class="price-tax">最終仕入 ${yen(lastIn.unitPrice||0)}</div>`:''}</div>
      </div>
      <div style="margin-top:9px;display:flex;gap:5px;flex-wrap:wrap">
        <button class="btn-sm" onclick="openIn(&quot;${item.id}&quot;)">📥 入庫</button>
        <button class="btn-sm" onclick="openOut(&quot;${item.id}&quot;)">📤 出庫</button>
        <button class="btn-sm" onclick="openUse(&quot;${item.id}&quot;)">🪚 使用</button>
        <button class="btn-sm" onclick="openRet(&quot;${item.id}&quot;)">↩️ 返却</button>
        <button class="btn-sm" style="background:#2a3a2a;color:#70c870" onclick="editItemModal(&quot;${item.id}&quot;)">✏️ 編集</button>
      </div>
    </div>`;
  }).join('');
  return `<input class="search-box" placeholder="🔍 品番・品名で検索…" value="${esc(searchVal)}" oninput="searchVal=this.value;render()"/>
  <div class="section-label">全品目 (${filtered.length}件)</div>
  ${cards||'<div class="empty-msg2">該当なし</div>'}`;
}

// ========== 金額 ==========
function renderMoney(){
  const pLabels={week:'今週',month:'今月',year:'今年',all:'全期間'};
  const pBtns=['week','month','year','all'].map(p=>`<button class="period-btn${moneyPeriod===p?' active':''}" onclick="moneyPeriod='${p}';render()">${pLabels[p]}</button>`).join('');
  const ph=history.filter(periodFilter);
  const inAmt=ph.filter(h=>h.type==='in').reduce((s,h)=>s+h.qty*(h.unitPrice||0),0);
  const outAmt=ph.filter(h=>['out','use'].includes(h.type)).reduce((s,h)=>s+h.qty*(h.unitPrice||0),0);
  const tv=totalStockValue();
  const ranked=[...items].sort((a,b)=>stockValue(b)-stockValue(a)).slice(0,20);
  const itemRankHtml=ranked.map((item,i)=>`<div class="money-row"><div><div class="money-row-label">${i+1}. ${esc(item.name)}</div><div style="color:#444;font-size:9px">${totalStock(item)}${esc(item.unit)} × ${yen(item.basePrice||0)}</div></div><div style="text-align:right"><div class="money-row-val mc-stock">${yen(stockValue(item))}</div><div style="color:#555;font-size:9px">${yen(stockValue(item)*1.1)}税込</div></div></div>`).join('');
  const locAmtHtml=locations.map(loc=>{const v=locStockValue(loc.id);return`<div class="money-row"><div class="money-row-label">${loc.icon} ${esc(loc.name)}</div><div style="text-align:right"><div class="money-row-val" style="color:${loc.color}">${yen(v)}</div><div style="color:#555;font-size:9px">${yen(v*1.1)}税込</div></div></div>`;}).join('');
  return `
    <div class="section-label">集計期間</div>
    <div style="padding:0 12px 4px"><div class="period-btns">${pBtns}</div></div>
    <div class="money-tab"><div class="money-tab-title">📊 在庫資産</div>
      <div class="money-row"><div class="money-row-label">総在庫金額（税抜）</div><div class="money-row-val mc-stock">${yen(tv)}</div></div>
      <div class="money-row"><div class="money-row-label">総在庫金額（税込）</div><div class="money-row-val mc-stock">${yen(tv*1.1)}</div></div>
    </div>
    <div class="money-tab" style="margin-top:6px"><div class="money-tab-title">💹 ${pLabels[moneyPeriod]}の収支</div>
      <div class="money-row"><div class="money-row-label">仕入れ合計（税抜）</div><div class="money-row-val mc-in">+${yen(inAmt)}</div></div>
      <div class="money-row"><div class="money-row-label">仕入れ合計（税込）</div><div class="money-row-val mc-in">+${yen(inAmt*1.1)}</div></div>
      <div class="money-row"><div class="money-row-label">出庫・使用合計（税抜）</div><div class="money-row-val mc-out">-${yen(outAmt)}</div></div>
      <div class="money-row"><div class="money-row-label">出庫・使用合計（税込）</div><div class="money-row-val mc-out">-${yen(outAmt*1.1)}</div></div>
    </div>
    <div class="money-tab" style="margin-top:6px"><div class="money-tab-title">🪵 品目別在庫金額 TOP20</div>${itemRankHtml}</div>
    <div class="money-tab" style="margin-top:6px"><div class="money-tab-title">📍 場所別在庫金額</div>${locAmtHtml}</div>`;
}

// ========== 履歴タブ ==========
function renderHist(){
  const typeFilters=[
    {key:'all',  label:'すべて',   color:'#c8962a'},
    {key:'in',   label:'📥 入庫',  color:'#70c870'},
    {key:'out',  label:'📤 出庫',  color:'#70a8e8'},
    {key:'use',  label:'🪚 使用',  color:'#e8b050'},
    {key:'ret',  label:'↩️ 返却', color:'#c870e8'},
  ];
  const filterHtml=typeFilters.map(f=>`
    <button class="filter-chip${histFilter===f.key?' active':''}"
      style="${histFilter===f.key?`background:${f.color}22;color:${f.color};border:1px solid ${f.color}44`:'background:#222220;color:#555;border:1px solid #2e2e28'}"
      onclick="histFilter='${f.key}';render()">${f.label}</button>`).join('');

  // 期間フィルター
  const periodBtns=[
    {key:'today',label:'今日'},
    {key:'week', label:'今週'},
    {key:'month',label:'今月'},
    {key:'all',  label:'全期間'},
  ].map(p=>`<button class="period-btn${histPeriod===p.key?' active':''}" onclick="histPeriod='${p.key}';render()">${p.label}</button>`).join('');

  const filtered=history.filter(h=>{
    // 種別フィルター
    if(histFilter!=='all'&&h.type!==histFilter) return false;
    // 期間フィルター
    const d=new Date(h.date),now=new Date();
    if(histPeriod==='today') return h.date===today();
    if(histPeriod==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
    if(histPeriod==='month') return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
    return true;
  });

  const totalAmt=filtered.reduce((s,h)=>s+h.qty*(h.unitPrice||0),0);
  const cards=filtered.length===0?'<div class="empty-msg2">記録なし</div>':filtered.map(h=>histCardHtml(h)).join('');

  return `
    <div class="filter-row">${filterHtml}</div>
    <div style="padding:4px 12px 2px"><div class="period-btns">${periodBtns}</div></div>

// ========== Excel取込み ==========
function handleDrop(e){
  const file=e.dataTransfer.files[0];
  if(file) processFile(file);
}
function handleFileInput(input){
  const file=input.files[0];
  if(file) processFile(file);
  input.value='';
}
function logImport(msg,type='info'){
  const log=document.getElementById('import-log');
  if(!log) return;
  log.style.display='block';
  const div=document.createElement('div');
  div.className=type;
  div.textContent=msg;
  log.appendChild(div);
  log.scrollTop=log.scrollHeight;
}
function processFile(file){
  const log=document.getElementById('import-log');
  if(log){log.style.display='block';log.innerHTML='';}
  logImport(`📂 ${file.name} を読み込み中...`,'info');
  if(file.name.endsWith('.json')){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=JSON.parse(e.target.result);
        if(data.locations&&data.items){
          locations=data.locations;items=data.items;history=data.history||[];
          save();logImport(`✅ 復元完了 場所:${locations.length} 品目:${items.length} 履歴:${history.length}件`,'ok');
          setTimeout(()=>render(),500);
        } else logImport('❌ 形式が正しくありません','err');
      }catch(ex){logImport('❌ JSONパースエラー: '+ex.message,'err');}
    };
    reader.readAsText(file);
  } else {
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'array'});
        importFromWorkbook(wb);
      }catch(ex){logImport('❌ Excelの読み込みエラー: '+ex.message,'err');}
    };
    reader.readAsArrayBuffer(file);
  }
}

function importFromWorkbook(wb){
  logImport('📊 シートを解析中...','info');
  // シート名から場所を判別
  const sheetMap={};
  wb.SheetNames.forEach(sn=>{
    const lower=sn.toLowerCase();
    // まとめシートはスキップ
    if(lower.includes('まとめ')||lower.includes('summary')) return;
    sheetMap[sn]=wb.Sheets[sn];
  });

  if(Object.keys(sheetMap).length===0){
    logImport('❌ 有効なシートが見つかりません','err');return;
  }

  const colors=['#c8962a','#5a9ae8','#70c870','#e870a0','#a070e8','#e8c870','#70e8e8','#e8a030','#888888','#c870e8'];
  const icons=['🪵','🔩','🌲','🔧','🏗️','📦','🗄️','🏢','🚛','📋'];
  const newLocs=[];
  const newItems=[];
  let itemId=Date.now();
  let locIdx=0;

  Object.entries(sheetMap).forEach(([sheetName,ws])=>{
    // 既存の場所を使うか新規作成
    let locName=sheetName.replace(/在庫リスト[\s*·]*/,'').replace(/\*/g,' ').replace(/\s+/g,' ').trim();
    let loc=locations.find(l=>l.name===locName)||newLocs.find(l=>l.name===locName);
    if(!loc){
      loc={id:'loc_'+Date.now()+'_'+locIdx,name:locName,icon:icons[locIdx%icons.length],color:colors[locIdx%colors.length],address:locName};
      newLocs.push(loc);locIdx++;
    }

    // シートをJSON配列に変換
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    // ヘッダー行を探す（在庫IDがある行）
    let headerRow=-1;
    for(let i=0;i<rows.length;i++){
      if(rows[i]&&rows[i].some(c=>c&&String(c).includes('在庫 ID'))){headerRow=i;break;}
      if(rows[i]&&rows[i].some(c=>c&&String(c).includes('在庫ID'))){headerRow=i;break;}
    }
    if(headerRow<0){logImport(`⚠️ ${sheetName}: ヘッダー行が見つかりません`,'err');return;}

    // 列インデックスを特定
    const hdr=rows[headerRow];
    const colId=hdr.findIndex(c=>c&&String(c).includes('在庫'));
    const colName=hdr.findIndex(c=>c&&(String(c).includes('名前')||String(c).includes('材種')));
    const colGrade=hdr.findIndex(c=>c&&(String(c).includes('等級')||String(c).includes('グレード')));
    const colSize=hdr.findIndex(c=>c&&String(c).includes('説明'));
    const colPrice=hdr.findIndex(c=>c&&String(c).includes('単価'));
    const colQty=hdr.findIndex(c=>c&&(String(c).includes('数量')||String(c).includes('在庫の数量')));

    let count=0;
    for(let i=headerRow+1;i<rows.length;i++){
      const row=rows[i];
      if(!row||!row[colId]||!row[colName]) continue;
      const stockId=String(row[colId]||'').replace(/\*/g,'-').trim();
      if(!stockId||stockId==='在庫 ID') continue;
      const nameRaw=String(row[colName]||'').replace(/\*/g,'・').replace(/\n/g,' ').trim();
      if(!nameRaw) continue;
      const grade=row[colGrade]?String(row[colGrade]).replace(/\*/g,'・').replace(/\n/g,' ').trim():'';
      const size=row[colSize]?String(row[colSize]).replace(/\*/g,'×').replace(/\n/g,' ').trim():'';
      let fullName=nameRaw;
      if(grade&&grade!=='nan') fullName+=' '+grade;
      if(size&&size!=='nan') fullName+=' '+size;
      const price=parseFloat(row[colPrice])||0;
      const qty=parseFloat(row[colQty])||0;

      // カテゴリ判定
      let cat='その他';
      if(/杉|スギ|桧|ヒノキ|欅|ケヤキ|樫|カシ|松|パイン|ラワン|ベリ|メルクシ|白樺|イペ|IPE|丸太|変木|栓|楔|車知/.test(nameRaw)) cat='木材';
      else if(/断熱|スタイロ|EPS|GW|合板|面材|サイデ|ダクト|STO|養生|ルーフィング|防水/.test(nameRaw)) cat='建材・断熱';
      else if(/ボルト|アンカー|ビス|釘|コーチ|羽子板|パイプ|全ねじ|鋼製束|プラ束|火打|ホールダウン|金物/.test(nameRaw)) cat='金物・資材';
      else if(/LED|換気|ファン|インターホン|ベントキャップ|給気|排気|点検口|ホスクリーン|ドア/.test(nameRaw)) cat='設備・電気';
      else if(/気密|パッキン|シール|テープ|ブチル|コーキング|防水部材/.test(nameRaw)) cat='気密・防水';

      // 既存品目があれば在庫を加算
      const allLocs=[...locations,...newLocs];
      let existing=newItems.find(it=>it.stockId===stockId)||items.find(it=>it.stockId===stockId);
      if(existing){
        if(!existing.stocks) existing.stocks={};
        existing.stocks[loc.id]=(existing.stocks[loc.id]||0)+qty;
      } else {
        const stocks={};
        allLocs.forEach(l=>{stocks[l.id]=0;});
        stocks[loc.id]=qty;
        newItems.push({id:itemId++,stockId,name:fullName,category:cat,unit:'本',minStock:0,basePrice:price,stocks});
      }
      count++;
    }
    logImport(`✅ ${locName}: ${count}品目取込み`,'ok');
  });

  // 既存データに場所・品目を追加
  newLocs.forEach(nl=>{
    locations.push(nl);
    // 既存品目に新場所の在庫欄を追加
    items.forEach(i=>{if(!i.stocks[nl.id])i.stocks[nl.id]=0;});
    newItems.forEach(i=>{if(!i.stocks[nl.id])i.stocks[nl.id]=0;});
  });
  // 新品目の既存場所欄を確保
  const allLocIds=locations.map(l=>l.id);
  newItems.forEach(ni=>{
    allLocIds.forEach(lid=>{if(ni.stocks[lid]===undefined)ni.stocks[lid]=0;});
    items.push(ni);
  });

  save();
  logImport(`🎉 取込み完了！ 場所:${locations.length} 品目:${items.length}`,'ok');
  setTimeout(()=>render(),800);
}

function showHistMenu(hid){

    <div class="sheet-desc">${m.label}：${esc(h.itemName)}（${h.qty}${h.date}）</div>
    <div class="data-btn-row">
      <button class="data-btn blue" onclick="closeModalForce();editHistModal(${hid})">✏️ この記録を編集する</button>
      <button class="data-btn red" onclick="closeModalForce();cancelHist(${hid})">↩️ この操作を取り消す（在庫を元に戻す）</button>
    </div>
    <button class="btn-cancel" style="width:100%;margin-top:10px" onclick="closeModalForce()">キャンセル</button>
  </div>`);
}
function editHistModal(hid){
  const h=history.find(x=>x.id===hid);if(!h)return;
  showModal(`<div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-title" style="color:#70a8e8">✏️ 記録を編集</div>
    <div class="sheet-desc">${esc(h.itemName)} - ${TYPE_META[h.type]?.label||h.type}</div>
    <label class="form-label">日付</label><input class="form-input" type="date" id="eh-date" value="${h.date}"/>
    <label class="form-label">数量</label><input class="form-input" type="number" id="eh-qty" value="${h.qty}" min="0.01" step="any"/>
    <label class="form-label">単価（税抜）</label><input class="form-input" type="number" id="eh-price" value="${h.unitPrice||0}" step="any"/>
    <label class="form-label">作業名</label><input class="form-input" type="text" id="eh-job" value="${esc(h.jobName||'')}"/>
    <label class="form-label">仕入れ先</label><input class="form-input" type="text" id="eh-supplier" value="${esc(h.supplier||'')}"/>
    <label class="form-label">メモ</label><input class="form-input" type="text" id="eh-memo" value="${esc(h.memo||'')}"/>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModalForce()">キャンセル</button>
      <button class="btn-confirm blue" onclick="doEditHist(${hid})">保存する</button>
    </div>
  </div>`);
}
function doEditHist(hid){
  const h=history.find(x=>x.id===hid);if(!h)return;
  const oldQty=h.qty;
  const newQty=parseFloat(document.getElementById('eh-qty').value)||0;
  const diff=newQty-oldQty;
  // 在庫数量を差分で調整
  const item=items.find(i=>i.id===h.itemId||i.name===h.itemName);
  if(item&&diff!==0){
    const locId=locations.find(l=>l.name===h.locName)?.id;
    const destId=locations.find(l=>l.name===h.destName)?.id;
    if(h.type==='in'&&locId) item.stocks[locId]=(item.stocks[locId]||0)+diff;
    else if((h.type==='out'||h.type==='use')&&locId) item.stocks[locId]=(item.stocks[locId]||0)-diff;
    else if(h.type==='ret'&&locId&&destId){item.stocks[locId]=(item.stocks[locId]||0)-diff;item.stocks[destId]=(item.stocks[destId]||0)+diff;}
  }
  h.qty=newQty;
  h.date=document.getElementById('eh-date').value||h.date;
  h.unitPrice=parseFloat(document.getElementById('eh-price').value)||0;
  h.jobName=document.getElementById('eh-job').value.trim();
  h.supplier=document.getElementById('eh-supplier').value.trim();
  h.memo=document.getElementById('eh-memo').value.trim();
  save();closeModalForce();render();
}
function cancelHist(hid){
  const h=history.find(x=>x.id===hid);if(!h)return;
  if(!confirm(`「${h.itemName}」の${TYPE_META[h.type]?.label||h.type}（${h.qty}個）を取り消しますか？\n在庫数量も元に戻ります。`))return;
  // 在庫を逆戻し
  const item=items.find(i=>i.id===h.itemId||i.name===h.itemName);
  if(item){
    const locId=locations.find(l=>l.name===h.locName)?.id;
    const destId=locations.find(l=>l.name===h.destName)?.id;
    if(h.type==='in'&&locId) item.stocks[locId]=Math.max(0,(item.stocks[locId]||0)-h.qty);
    else if((h.type==='out'||h.type==='use')&&locId) item.stocks[locId]=(item.stocks[locId]||0)+h.qty;
    else if(h.type==='ret'&&locId&&destId){item.stocks[locId]=(item.stocks[locId]||0)+h.qty;item.stocks[destId]=Math.max(0,(item.stocks[destId]||0)-h.qty);}
  }
  history.splice(history.findIndex(x=>x.id===hid),1);
  save();render();
}

// ========== モーダル共通 ==========
function showModal(html){document.getElementById('modal-container').innerHTML=`<div class="overlay" id="modal-overlay" onclick="closeModal(event)">${html}</div>`;}
function closeModal(e){if(!e||e.target.id==='modal-overlay')closeModalForce();}
function closeModalForce(){document.getElementById('modal-container').innerHTML='';}
function itemOpts(preId){return items.map(i=>`<option value="${i.id}"${String(preId)===String(i.id)?' selected':''}>${esc(i.stockId||'')} ${esc(i.name)}</option>`).join('');}
function locOpts(preId,typeFilter){
  const filtered=typeFilter?locations.filter(l=>(l.locType||'warehouse')===typeFilter):locations;
  const warehouses=filtered.filter(l=>(l.locType||'warehouse')==='warehouse');
  const sites=filtered.filter(l=>l.locType==='site');
  let opts='<option value="">選択してください</option>';
  if(warehouses.length){opts+='<optgroup label="🏠 倉庫・保管場所">'+warehouses.map(l=>`<option value="${l.id}"${preId===l.id?' selected':''}>${l.icon} ${esc(l.name)}</option>`).join('')+'</optgroup>';}
  if(sites.length){opts+='<optgroup label="🏗️ 現場">'+sites.map(l=>`<option value="${l.id}"${preId===l.id?' selected':''}>${l.icon} ${esc(l.name)}</option>`).join('')+'</optgroup>';}
  if(!warehouses.length&&!sites.length) opts+=locations.map(l=>`<option value="${l.id}"${preId===l.id?' selected':''}>${l.icon} ${esc(l.name)}</option>`).join('');
  return opts;
}
function showPriceHint(selId,hintId){
  const itemId=parseInt(document.getElementById(selId).value);
  const item=items.find(i=>String(i.id)===String(itemId));
  const lastIn=item?history.filter(h=>h.type==='in'&&h.itemId===item.id).sort((a,b)=>b.date.localeCompare(a.date))[0]:null;
  const el=document.getElementById(hintId);
  if(el&&item)el.textContent=`基準単価: ${yen(item.basePrice||0)}/${item.unit}${lastIn?' / 最終仕入: '+yen(lastIn.unitPrice||0):''}`;

function handleInLocChange(val){
  const newDiv = document.getElementById('in-loc-new');
  if(newDiv) newDiv.style.display = val==='__new__' ? 'block' : 'none';
}
function addLocFromIn(){
  const nameInput = document.getElementById('in-loc-new-name');
  const name = nameInput ? nameInput.value.trim() : '';
  if(!name){ alert('場所名を入力してください'); return; }
  if(locations.find(l=>l.name===name)){ alert('同じ名前の場所がすでにあります'); return; }
  const newLoc = {id:'loc-'+Date.now(),name:name,icon:'📦',locType:'warehouse',prefix:'',memo:''};
  locations.push(newLoc);
  save();
  // プルダウンを更新して新しい場所を選択
  const sel = document.getElementById('in-loc');
  if(sel){
    const opt = document.createElement('option');
    opt.value = newLoc.id;
    opt.textContent = '📦 ' + name;
    // __new__の前に挿入
    const newOpt = sel.querySelector('option[value="__new__"]');
    sel.insertBefore(opt, newOpt);
    sel.value = newLoc.id;
  }
  const newDiv = document.getElementById('in-loc-new');
  if(newDiv) newDiv.style.display = 'none';
  alert('✅ 「' + name + '」を追加しました');
}
function doIn(){
  const itemId=String(document.getElementById('in-item').value);
  const locId=document.getElementById('in-loc').value;
  const qty=parseFloat(document.getElementById('in-qty').value);
  const unitPrice=parseFloat(document.getElementById('in-price').value)||0;
  const supplier=document.getElementById('in-supplier').value.trim();
  const memo=document.getElementById('in-memo').value.trim();
  if(!locId||!qty||qty<=0)return alert('数量と場所を入力してください');
  const item=items.find(i=>String(i.id)===String(itemId));if(!item)return;
  item.stocks[locId]=(item.stocks[locId]||0)+qty;
  if(unitPrice>0)item.basePrice=unitPrice;
  const loc=locations.find(l=>l.id===locId);
  history.unshift({id:Date.now(),date:today(),type:'in',itemId,itemName:item.name,stockId:item.stockId||'',qty,locName:loc?.name||'',destName:'',jobName:'',supplier,memo,unitPrice});
  save();closeModalForce();render();
}

// ========== 出庫 ==========
function destOpts(selected,excludeLocId){
  const locs=locations.filter(l=>l.id!==excludeLocId);
  const sites=locs.filter(l=>l.locType==='site');
  const warehouses=locs.filter(l=>(l.locType||'warehouse')==='warehouse');
  let opts='<option value="">-- 搬入先を選択 --</option>';
  if(sites.length){
    opts+='<optgroup label="🏗️ 現場">';
    sites.forEach(l=>{opts+=`<option value="loc:${l.id}"${selected===('loc:'+l.id)?' selected':''}>${l.icon} ${esc(l.name)}</option>`;});
    opts+='</optgroup>';
  }
  if(warehouses.length){
    opts+='<optgroup label="🏠 倉庫・保管場所">';
    warehouses.forEach(l=>{opts+=`<option value="loc:${l.id}"${selected===('loc:'+l.id)?' selected':''}>${l.icon} ${esc(l.name)}</option>`;});
    opts+='</optgroup>';
  }
  const locNames=locations.map(l=>l.name);
  const pastNames=[...new Set(history.filter(h=>h.destName&&!locNames.includes(h.destName)&&h.type!=='ret').map(h=>h.destName))];
  if(pastNames.length){
    opts+='<optgroup label="📋 過去の搬出先（履歴）">';
    pastNames.forEach(d=>{opts+=`<option value="name:${esc(d)}"${selected===('name:'+d)?' selected':''}>${esc(d)}</option>`;});
    opts+='</optgroup>';
  }
  opts+='<option value="__new__">＋ 新規で入力する</option>';
  return opts;
}
function onDestSelect(selId,inputId){
  const v=document.getElementById(selId).value;
  const inp=document.getElementById(inputId);
  if(v==='__new__'){inp.style.display='block';inp.focus();}
  else{inp.style.display='none';inp.value='';}
}
function getDestVal(selId,inputId){
  const sel=document.getElementById(selId);
  const inp=document.getElementById(inputId);
  if(sel.value==='__new__') return inp.value.trim();
  if(sel.value.startsWith('loc:')){const locId=sel.value.slice(4);return locations.find(l=>l.id===locId)?.name||'';}
  if(sel.value.startsWith('name:')) return sel.value.slice(5);
  return inp.value.trim();
}
function getDestLocId(selId){
  const sel=document.getElementById(selId);
  if(sel&&sel.value.startsWith('loc:')) return sel.value.slice(4);
  return null;
}
function itemOptsForLoc(locId,preId){
  // 指定場所に在庫がある品目のみ
  const filtered=locId?items.filter(i=>(i.stocks[locId]||0)>0):items;
  if(filtered.length===0) return '<option value="">この場所に在庫がありません</option>';
  return filtered.map(i=>`<option value="${i.id}"${String(preId)===String(i.id)?' selected':''}>` + esc((i.stockId||'')+' '+i.name) + ` (${i.stocks[locId]||0}${esc(i.unit)})</option>`).join('');
}

    <div class="btn-row"><button class="btn-cancel" onclick="closeModalForce()">キャンセル</button><button class="btn-confirm blue" onclick="doOut()">出庫する</button></div>
  </div>`);
}
function doOut(){
  const itemId=String(document.getElementById('out-item').value);
  const fromId=document.getElementById('out-from').value;
  const dest=getDestVal('out-dest-sel','out-dest-inp');
  const destLocId=getDestLocId('out-dest-sel'); // 場所一覧から選んだ場合のlocId
  const qty=parseFloat(document.getElementById('out-qty').value);
  const unitPrice=parseFloat(document.getElementById('out-price').value)||0;
  const job=document.getElementById('out-job').value.trim();
  const memo=document.getElementById('out-memo').value.trim();
  if(!fromId||!qty||qty<=0)return alert('数量と出庫元を入力してください');
  if(!dest)return alert('搬入先を選択または入力してください');
  const item=items.find(i=>String(i.id)===String(itemId));if(!item)return;
  if((item.stocks[fromId]||0)<qty)return alert(`在庫不足（現在: ${item.stocks[fromId]||0}${item.unit}）`);
  // 出庫元から減算
  item.stocks[fromId]-=qty;
  // 搬入先が場所一覧の場合は自動加算
  if(destLocId&&item.stocks[destLocId]!==undefined){
    item.stocks[destLocId]=(item.stocks[destLocId]||0)+qty;
  } else if(destLocId){
    item.stocks[destLocId]=qty;
  }
  const loc=locations.find(l=>l.id===fromId);
  history.unshift({id:Date.now(),date:today(),type:'out',itemId,itemName:item.name,stockId:item.stockId||'',qty,locName:loc?.name||'',destName:dest,destLocId:destLocId||'',jobName:job,supplier:'',memo,unitPrice});
  save();closeModalForce();render();
}

  save();closeModalForce();render();
}

// ========== 品番サポート ==========
function getLocPrefix(locId){
  const loc=locations.find(l=>l.id===locId);
  return loc?.prefix||'';
}
function suggestNextStockId(locId){
  const prefix=getLocPrefix(locId);
  if(!prefix) return '';
  // そのプレフィックスで始まる品目の番号を収集
  const nums=items
    .map(i=>i.stockId||'')
    .filter(sid=>sid.startsWith(prefix))
    .map(sid=>{
      const rest=sid.slice(prefix.length).replace(/^[-_*]/,'');
      const n=parseInt(rest);
      return isNaN(n)?0:n;
    });
  const next=(nums.length?Math.max(...nums):0)+1;
  return prefix+'-'+String(next).padStart(3,'0');
}
function onLocChangeForItem(){
  const locId=document.getElementById('ai-loc')?.value;
  if(!locId) return;
  const suggested=suggestNextStockId(locId);
  const sidInput=document.getElementById('ai-sid');
  if(sidInput&&!sidInput.dataset.userEdited){
    sidInput.value=suggested;
    // プレビュー更新
    updateStockIdPreview();
  }
}
function updateStockIdPreview(){
  const val=document.getElementById('ai-sid')?.value||'';
  const preview=document.getElementById('ai-sid-preview');
  if(preview) preview.textContent=val?'品番: '+val:'';
}
function onStockIdInput(){
  const el=document.getElementById('ai-sid');
  if(el) el.dataset.userEdited='1';
  updateStockIdPreview();
}

let pendingItems = JSON.parse(localStorage.getItem('dk_pending')||'[]');

function handleKaidashiDrop(e){
  const file=e.dataTransfer.files[0];
  if(file) processKaidashiFile(file);
}
function handleKaidashiFile(input){
  const file=input.files[0];
  if(file) processKaidashiFile(file);
  input.value='';
}

async function processKaidashiFile(file){
  const statusEl=document.getElementById('kaidashi-status');
  statusEl.style.display='block';
  statusEl.textContent='🤖 AIが読み取り中...';
  statusEl.style.color='#70a8e8';

  try{
    // ファイルをbase64に変換
    const b64=await fileToBase64(file);
    const isPdf=file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf');
    const mediaType=isPdf?'application/pdf':file.type||'image/jpeg';

    const prompt=`あなたは建設工務店の資材管理AIです。
この画像（買い出しメモ・納品書・レシート等）から品目一覧を抽出してください。
以下のJSON配列のみを返してください。他のテキストは不要です。

[
  {
    "name": "品名（材種・寸法を含む具体的な名前）",
    "qty": 数量（数値、不明は1）,
    "unit": "単位（本/枚/個/m/kg等）",
    "price": 単価（数値、不明は0）,
    "category": "木材 or 建材・断熱 or 金物・資材 or 設備・電気 or 気密・防水 or その他"
  }
]

読み取れない場合は空配列[]を返してください。`;

    const body={
      model:'claude-sonnet-4-5',
      max_tokens:2000,
      messages:[{
        role:'user',
        content:[
          isPdf
            ? {type:'document',source:{type:'base64',media_type:mediaType,data:b64}}
            : {type:'image',source:{type:'base64',media_type:mediaType,data:b64}},
          {type:'text',text:prompt}
        ]
      }]
    };

    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    const data=await res.json();
    const text=(data.content||[]).map(c=>c.text||'').join('');
    const clean=text.replace(/```json|```/g,'').trim();
    const extracted=JSON.parse(clean);

    if(!Array.isArray(extracted)||extracted.length===0){
      statusEl.textContent='⚠️ 品目を読み取れませんでした。画像を確認してください。';
      statusEl.style.color='#e87050';
      return;
    }

    // 未設定リストに追加
    extracted.forEach(e=>{
      pendingItems.push({
        id:'pnd-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
        name:e.name||'不明',
        qty:parseFloat(e.qty)||1,
        unit:e.unit||'個',
        price:parseFloat(e.price)||0,
        category:e.category||'その他',
        locId:'',
        checked:true,
        stockId:''
      });
    });
    savePending();
    statusEl.textContent=`✅ ${extracted.length}品目を抽出しました。下の未設定リストで場所を設定して入庫してください。`;
    statusEl.style.color='#70c870';
    render();

  }catch(err){
    statusEl.textContent='⚠️ エラー: '+err.message;
    statusEl.style.color='#e87050';
    console.error(err);
  }
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result.split(',')[1]);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

function suggestNextStockIdForPending(locId, pendingIdx){
  // 既存品目 + 既にpendingで使われた品番を除いて採番
  const prefix=getLocPrefix(locId);
  if(!prefix) return '';
  const usedNums=new Set();
  items.forEach(i=>{
    const sid=i.stockId||'';
    if(sid.startsWith(prefix)){
      const n=parseInt(sid.slice(prefix.length).replace(/^[-_]/,''));
      if(!isNaN(n)) usedNums.add(n);
    }
  });
  pendingItems.slice(0,pendingIdx).forEach(p=>{
    const sid=p.stockId||'';
    if(sid.startsWith(prefix)){
      const n=parseInt(sid.slice(prefix.length).replace(/^[-_]/,''));
      if(!isNaN(n)) usedNums.add(n);
    }
  });
  let next=1;
  while(usedNums.has(next)) next++;
  return prefix+'-'+String(next).padStart(3,'0');
}

function togglePending(idx){ pendingItems[idx].checked=!pendingItems[idx].checked; savePending(); renderPendingList(); }
function updatePending(idx,key,val){
  pendingItems[idx][key]=val;
  // 場所変更時に品番を自動提案
  if(key==='locId'&&!pendingItems[idx].stockId){
    pendingItems[idx].stockId=suggestNextStockIdForPending(val,idx);
  }
  savePending(); renderPendingList();
}
function removePending(idx){ pendingItems.splice(idx,1); savePending(); render(); }

    }

}

function commitPendingItems(){
  const checked=pendingItems.filter(p=>p.checked);
  if(checked.length===0){ alert('チェックされた品目がありません'); return; }
  const noLoc=checked.filter(p=>!p.locId);
  if(noLoc.length>0){ alert(`${noLoc.length}品目の場所が未設定です。\n場所を設定してください。`); return; }

  let added=0;
  checked.forEach(p=>{
    // 既存品目と同名があればマージ、なければ新規
    let existing=items.find(i=>i.name===p.name);
    if(existing){
      existing.stocks[p.locId]=(existing.stocks[p.locId]||0)+(parseFloat(p.qty)||0);
      if(p.price>0) existing.basePrice=p.price;
      history.unshift({id:Date.now()+Math.random(),date:today(),type:'in',itemId:existing.id,itemName:existing.name,stockId:existing.stockId||'',qty:parseFloat(p.qty)||0,locName:locations.find(l=>l.id===p.locId)?.name||'',destName:'',jobName:'',supplier:'買い出しリスト取込み',memo:'AI読み取り入庫',unitPrice:p.price||existing.basePrice||0});
    } else {
      const stocks={};locations.forEach(l=>{stocks[l.id]=0;});
      stocks[p.locId]=parseFloat(p.qty)||0;
      const newItem={id:Date.now()+Math.random(),stockId:p.stockId||'',name:p.name,category:p.category||'その他',unit:p.unit||'個',minStock:0,basePrice:p.price||0,stocks};
      items.push(newItem);
      history.unshift({id:Date.now()+Math.random()+1,date:today(),type:'in',itemId:newItem.id,itemName:newItem.name,stockId:newItem.stockId||'',qty:parseFloat(p.qty)||0,locName:locations.find(l=>l.id===p.locId)?.name||'',destName:'',jobName:'',supplier:'買い出しリスト取込み',memo:'AI読み取り入庫',unitPrice:p.price||0});
    }
    added++;
  });

  // 入庫済みをリストから除去
  pendingItems=pendingItems.filter(p=>!p.checked);
  savePending();
  save();
  render();
  alert(`✅ ${added}品目を入庫しました`);
}

function recordSession(type){

function setupPWA(){
  // SVGアイコン生成
  const iconSvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="100" fill="#222220"/><rect x="50" y="50" width="412" height="412" rx="70" fill="#2a2a24"/><text x="256" y="230" text-anchor="middle" font-size="180" fill="#c8962a">🔨</text><text x="256" y="360" text-anchor="middle" font-size="64" font-family="sans-serif" fill="#e8d5a3" font-weight="bold">在庫</text><text x="256" y="420" text-anchor="middle" font-size="34" font-family="sans-serif" fill="#888">大竹工務店</text></svg>`;
  const iconB64='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(iconSvg)));

  // apple-touch-icon（iOSホーム画面アイコン）
  ['apple-touch-icon','shortcut icon'].forEach(rel=>{
    const l=document.createElement('link');l.rel=rel;l.href=iconB64;document.head.appendChild(l);
  });

  // Web App Manifest を Blob URL で生成
  const manifest={
    name:'大竹工務店 在庫管理',short_name:'大竹在庫',
    description:'大竹工務店の在庫管理アプリ',
    start_url:location.pathname||'/',
    scope:location.pathname.replace(/\/[^\/]*$/,'/')||'/',
    display:'standalone',
    background_color:'#1a1a16',theme_color:'#c8962a',
    orientation:'portrait-primary',lang:'ja',
    categories:['productivity','utilities'],
    icons:[
      {src:iconB64,sizes:'192x192',type:'image/svg+xml',purpose:'any'},
      {src:iconB64,sizes:'512x512',type:'image/svg+xml',purpose:'any'},
      {src:iconB64,sizes:'192x192',type:'image/svg+xml',purpose:'maskable'},
    ]
  };
  try{
    const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    const mUrl=URL.createObjectURL(mBlob);
    const ml=document.getElementById('pwa-manifest');
    if(ml){ml.href=mUrl;ml.type='application/manifest+json';}
  }catch(e){console.log('manifest error:',e);}

  // Service Worker を無効化・古いキャッシュを全削除
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(regs=>{
      regs.forEach(r=>r.unregister());
    }).catch(()=>{});
  }
  if('caches' in window){
    caches.keys().then(keys=>{
      keys.forEach(key=>caches.delete(key));
    }).catch(()=>{});
  }
}

  html += '<button onclick="syncFromNippo()" style="width:100%;background:#1e3a1e;color:#70c870;border:1px solid #2e4a2e;border-radius:8px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">&#128229; 日報から在庫を同期</button>';
  html += '<div id="nippo-sync-msg" style="font-size:11px;margin-top:8px;color:#555"></div>';
  html += '</div>';

  html += '</div>';
  return html;
}

function importZaikoJSON(){
  var msg = document.getElementById('zaiko-json-msg');
  var raw = document.getElementById('zaiko-json-input') ? document.getElementById('zaiko-json-input').value.trim() : '';
  try{
    var d = JSON.parse(raw);
    var action = d.action || 'in';
    var invItems = JSON.parse(localStorage.getItem('dk_items')||'[]');
    var invHist  = JSON.parse(localStorage.getItem('dk_hist')||'[]');
    var invLocs  = JSON.parse(localStorage.getItem('dk_loc')||'[]');
    var today    = new Date().toISOString().slice(0,10);
    var count = 0;
    (d.items||[]).forEach(function(p){
      var locId = '';
      for(var i=0;i<invLocs.length;i++){ if(invLocs[i].name===p.locName){ locId=invLocs[i].id; break; } }
      if(!locId && invLocs.length) locId = invLocs[0].id;
      var item = null;
      for(var i=0;i<invItems.length;i++){ if(invItems[i].name===p.name){ item=invItems[i]; break; } }
      if(!item && (action==='in'||action==='update')){
        item = {id:'itm-'+Date.now()+'-'+Math.floor(Math.random()*100000),name:p.name,unit:p.unit||'個',category:p.category||'その他',basePrice:p.unitPrice||0,stocks:{},minStock:0,stockId:'',memo:''};
        item.stocks[locId] = 0;
        invItems.push(item);
      }
      if(!item) return;
      if(!item.stocks) item.stocks = {};
      var cur = parseFloat(item.stocks[locId]||0);
      var qty = parseFloat(p.qty)||0;
      if(action==='in') item.stocks[locId] = cur + qty;
      else if(action==='out'||action==='use') item.stocks[locId] = Math.max(0, cur - qty);
      else if(action==='update') item.stocks[locId] = qty;
      var locName = '';
      for(var i=0;i<invLocs.length;i++){ if(invLocs[i].id===locId){ locName=invLocs[i].name; break; } }
      invHist.unshift({id:Date.now()+Math.random(),date:p.date||today,type:action==='update'?'in':action,itemId:item.id,itemName:item.name,stockId:item.stockId||'',qty:qty,locName:locName||p.locName||'',jobName:p.jobName||'',memo:'チャットJSONインポート',unitPrice:p.unitPrice||0});
      count++;
    });
    localStorage.setItem('dk_items', JSON.stringify(invItems));
    localStorage.setItem('dk_hist',  JSON.stringify(invHist));
    items = invItems; history = invHist;
    render();
    if(msg){
      msg.style.color='#70c870';
      var locName = invLocs.length ? invLocs[0].name : '未設定';
      // インポートした品目の場所名を収集
      var locSet = {};
      (d.items||[]).forEach(function(p){ if(p.locName) locSet[p.locName]=1; });
      var locNames = Object.keys(locSet).join('・') || locName;
      msg.textContent = '✅ '+count+'品目を在庫資産サマリーに格納しました（場所: '+locNames+'）';
    }
    document.getElementById('zaiko-json-input').value = '';
  }catch(e){
    if(msg){ msg.style.color='#e87050'; msg.textContent='⚠️ JSONの形式が正しくありません'; }
  }
}

function syncFromNippo(){
  var msg = document.getElementById('nippo-sync-msg');
  try{
    var nippos = JSON.parse(localStorage.getItem('nip_nippos')||'[]');
    if(!nippos.length){ if(msg){ msg.style.color='#e87050'; msg.textContent='⚠️ 日報データがありません'; } return; }
    var invItems = JSON.parse(localStorage.getItem('dk_items')||'[]');
    var invHist  = JSON.parse(localStorage.getItem('dk_hist')||'[]');
    var invLocs  = JSON.parse(localStorage.getItem('dk_loc')||'[]');
    var synced = {};
    invHist.filter(function(h){ return h.nippoId; }).forEach(function(h){ synced[h.nippoId]=true; });
    var applied = 0;
    nippos.forEach(function(n){
      if(!n.materials || synced[n.id]) return;
      var jobName = n.jobName||n.jobCode||'';
      n.materials.filter(function(m){ return m.invItemId&&m.qty>0&&m.invAction!=='memo'; }).forEach(function(m){
        var item = null;
        for(var i=0;i<invItems.length;i++){ if(invItems[i].id==m.invItemId||invItems[i].name===m.name){ item=invItems[i]; break; } }
        if(!item) return;
        var locId = m.invLocId || Object.keys(item.stocks||{})[0] || '';
        var cur = parseFloat((item.stocks||{})[locId]||0);
        if(m.invAction==='use'||m.invAction==='out') item.stocks[locId] = Math.max(0, cur-(parseFloat(m.qty)||0));
        var locName = '';
        for(var i=0;i<invLocs.length;i++){ if(invLocs[i].id===locId){ locName=invLocs[i].name; break; } }
        invHist.unshift({id:Date.now()+Math.random(),date:n.date,type:m.invAction==='out'?'out':'use',itemId:item.id,itemName:item.name,stockId:item.stockId||'',qty:parseFloat(m.qty)||0,locName:locName,jobName:jobName,memo:'日報同期',nippoId:n.id});
        applied++;
      });
    });
    localStorage.setItem('dk_items', JSON.stringify(invItems));
    localStorage.setItem('dk_hist',  JSON.stringify(invHist));
    items = invItems; history = invHist; render();
    if(msg){ msg.style.color='#70c870'; msg.textContent='✅ '+applied+'件の在庫操作を反映しました'; }
  }catch(e){
    if(msg){ msg.style.color='#e87050'; msg.textContent='⚠️ 同期失敗: '+e.message; }
  }
}

</script>
